<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>修 修仙模拟器 | wr0ld's Blog</title>
<style>
:root {
  color-scheme: dark;--bg:#0a0a0f;--card:#16162a;--t1:#f0f0f5;--t2:#8b8ba3;--accent:#6c5ce7;--border:rgba(255,255,255,.06)}
*{margin:0;padding:0;box-sizing:border-box}
  html{background:var(--bg)}
body{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t1);min-height:100vh}
.nav{position:sticky;top:0;z-index:100;backdrop-filter:blur(20px);background:rgba(10,10,15,.78);border-bottom:1px solid var(--border);padding:0 24px}
.nav-inner{max-width:900px;margin:0 auto;height:60px;display:flex;align-items:center;justify-content:space-between}
.nav-left{display:flex;align-items:center;gap:16px}
.logo{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-weight:700;font-size:1.15rem;text-decoration:none;color:#a29bfe}
.nav-back{color:var(--t2);text-decoration:none;font-size:.85rem;padding:6px 14px;border-radius:8px;border:1px solid var(--border);transition:.2s}
.nav-back:hover{color:var(--t1);background:rgba(255,255,255,.05)}

.main{max-width:800px;margin:0 auto;padding:36px 20px 60px;text-align:center}

/* 游戏容器样式覆盖 */
.game-container { max-width: 100%; margin: 0 auto; padding: 0; text-align: center; }
.game-header h1 { font-size: 2em; margin-bottom: 22px; font-weight: 700; }
.game-controls { margin: 18px 0; }
.game-controls button { padding: 10px 24px; margin: 0 8px; font-size: 15px; cursor: pointer; background: linear-gradient(135deg,#6c5ce7,#a29bfe); color: #fff; border: none; border-radius: 10px; font-weight: 600; transition: .25s; }
.game-controls button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(108,92,231,.4); }
.game-controls button:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
.game-controls select { padding: 10px 14px; font-size: 15px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--t1); outline: none; }

.game-info { display: flex; justify-content: center; gap: 20px; margin: 16px 0; font-size: 16px; color: var(--t2); flex-wrap: wrap; }
.game-info span { color: var(--accent); font-weight: 500; }
.game-board-container { position: relative; display: inline-block; margin: 18px 0; }

#gameCanvas, #nextCanvas { border: 2px solid rgba(108,92,231,.3); border-radius: 12px; display: block; }

.game-over, .game-win {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  background: rgba(10,10,15,.95); color: #fff; padding: 34px 44px;
  border-radius: 16px; text-align: center; border: 1px solid var(--border);
  backdrop-filter: blur(12px); z-index: 10;
}
.game-over.hidden, .game-win.hidden { display: none !important; }
.game-over h2, .game-win h2 { font-size: 1.6em; margin-bottom: 14px; color: #e74c3c; }
.game-over p, .game-win p { margin-bottom: 18px; color: var(--t2); font-size: 1.05em; }
.game-over button, .game-win button {
  padding: 11px 28px; font-size: 15px; cursor: pointer;
  background: linear-gradient(135deg,#6c5ce7,#a29bfe); color: #fff;
  border: none; border-radius: 10px; font-weight: 600;
}

.game-instructions {
  margin-top: 32px; text-align: left; padding: 22px 26px;
  background: var(--card); border-radius: 14px; border: 1px solid var(--border);
}
.game-instructions h3 { margin-bottom: 14px; color: var(--accent); font-size: 1.05em; }
.game-instructions ul { list-style: none; padding: 0; }
.game-instructions li { padding: 7px 0 7px 22px; position: relative; color: var(--t2); font-size: .9rem; line-height: 1.5; }
.game-instructions li::before { content: '▸'; position: absolute; left: 0; color: var(--accent); font-weight: bold; }

@media(max-width:640px){
  .nav-inner{height:52px;padding:0 16px}
  .main{padding:24px 16px 40px}
  #gameCanvas{max-width:100%;height:auto!important}
  .game-info{gap:12px;font-size:14px}
  .game-board-container{overflow-x:auto}
}
</style>
</head>

<main class="main">

<div class="xiuxian-container">
  <div class="game-header">
    <h1>☯️ 修仙模拟器</h1>
    <div class="player-info">
      <div class="info-row">
        <span class="label">道号:</span>
        <span id="playerName" class="value name">无名散修</span>
      </div>

        <span class="label">境界:</span>
        <span id="realm" class="value realm">凡人</span>
      </div>

        <span class="label">寿元:</span>
        <span id="age" class="value">0</span>/<span id="maxAge">100</span>岁
      </div>
      <div class="progress-bar">
        <div class="progress-label">灵气</div>
        <div class="progress-track">
          <div id="qiBar" class="progress-fill qi" style="width: 0%"></div>
        </div>
        <span id="qiText" class="progress-text">0/100</span>
      </div>
      <div class="progress-bar">
        <div class="progress-label">修为</div>
        <div class="progress-track">
          <div id="expBar" class="progress-fill exp" style="width: 0%"></div>
        </div>
        <span id="expText" class="progress-text">0/100</span>
      </div>
    </div>
  </div>

  <div class="game-tabs">
    <button class="tab-btn active" data-tab="cultivate">修炼</button>
    <button class="tab-btn" data-tab="explore">探索</button>
    <button class="tab-btn" data-tab="alchemy">炼丹</button>
    <button class="tab-btn" data-tab="inventory">背包</button>
    <button class="tab-btn" data-tab="skills">功法</button>
  </div>

  <div class="game-content">
    <div id="cultivate" class="tab-content active">
      <div class="cultivate-area">
        <div class="meditation-circle" id="meditationCircle">
          <div class="inner-circle">
            <span id="meditationText">打坐</span>
          </div>
        </div>
        <div class="cultivate-info">
          <p>当前效率: <span id="efficiency">1.0</span>x</p>
          <p>每秒灵气: <span id="qiPerSec">1</span></p>
        </div>
        <div class="quick-actions">
          <button onclick="game.cultivate()" class="action-btn">🧘 打坐修炼</button>
          <button onclick="game.breakthrough()" class="action-btn highlight" id="breakthroughBtn">⚡ 突破境界</button>
          <button onclick="game.secluded()" class="action-btn">🚪 闭关修炼</button>
        </div>
      </div>
    </div>

    <div id="explore" class="tab-content">
      <div class="explore-area">
        <h3>🗺️ 秘境探索</h3>
        <div class="location-list" id="locationList"></div>
        <div class="battle-area hidden" id="battleArea">
          <div class="enemy-info">
            <h4 id="enemyName">妖兽</h4>
            <div class="progress-bar">
              <div class="progress-label">生命</div>
              <div class="progress-track">
                <div id="enemyHpBar" class="progress-fill hp" style="width: 100%"></div>
              </div>
              <span id="enemyHpText" class="progress-text">100/100</span>
            </div>
          </div>
          <div class="battle-log" id="battleLog"></div>
          <div class="battle-actions">
            <button onclick="game.attack()" class="action-btn">⚔️ 攻击</button>
            <button onclick="game.useSkill()" class="action-btn">🌟 施法</button>
            <button onclick="game.flee()" class="action-btn">🏃 逃跑</button>
          </div>
        </div>
      </div>
    </div>

    <div id="alchemy" class="tab-content">
      <div class="alchemy-area">
        <h3>🔥 炼丹炉</h3>
        <div class="furnace">
          <div class="furnace-visual">🔥</div>
          <p id="alchemyStatus">选择丹方开始炼丹</p>
        </div>
        <div class="recipe-list" id="recipeList"></div>
      </div>
    </div>

    <div id="inventory" class="tab-content">
      <div class="inventory-area">
        <div class="resource-display">
          <div class="resource-item">
            <span class="icon">💎</span>
            <span>灵石: <span id="spiritStones">0</span></span>
          </div>
          <div class="resource-item">
            <span class="icon">🌿</span>
            <span>灵草: <span id="herbs">0</span></span>
          </div>
          <div class="resource-item">
            <span class="icon">🔮</span>
            <span>妖丹: <span id="monsterCores">0</span></span>
          </div>
        </div>
        <h3>📦 物品栏</h3>
        <div class="item-grid" id="itemGrid"></div>
      </div>
    </div>

    <div id="skills" class="tab-content">
      <div class="skills-area">
        <h3>📜 功法秘籍</h3>
        <div class="skill-list" id="skillList"></div>
        <h3>🎯 已学功法</h3>
        <div class="learned-skills" id="learnedSkills"></div>
      </div>
    </div>
  </div>

  <div class="game-log">
    <h4>📜 修仙日志</h4>
    <div id="gameLog" class="log-content"></div>
  </div>

  <div id="gameOver" class="game-over hidden">
    <h2>道消身陨</h2>
    <p id="deathReason">寿元耗尽</p>
    <p>最终境界: <span id="finalRealm">凡人</span></p>
    <p>修仙年限: <span id="finalAge">0</span>年</p>
    <button onclick="game.restart()">转世重修</button>
  </div>
</div>

  { id: 'qi_pill', name: '聚气丹', icon: '💊', herbs: 5, stones: 10, effect: { qi: 100 }, desc: '增加100灵气' },
  { id: 'exp_pill', name: '悟道丹', icon: '🌟', herbs: 10, stones: 20, effect: { exp: 200 }, desc: '增加200修为' },
  { id: 'life_pill', name: '延寿丹', icon: '🌿', herbs: 20, stones: 50, cores: 5, effect: { maxAge: 50 }, desc: '增加50寿元' },
  { id: 'power_pill', name: '力量丹', icon: '⚔️', herbs: 15, stones: 30, cores: 3, effect: { tempPower: 50 }, desc: '临时增加50战力' },
  { id: 'breakthrough_pill', name: '破境丹', icon: '⚡', herbs: 50, stones: 100, cores: 10, effect: { breakthrough: true }, desc: '提高突破成功率' }
];

const SKILLS = [
  { id: 'basic_cultivation', name: '基础吐纳术', icon: '🧘', cost: 0, effect: { qiMult: 1.5 }, desc: '灵气获取+50%' },
  { id: 'sword_art', name: '御剑术', icon: '⚔️', cost: 100, effect: { power: 20 }, desc: '战力+20' },
  { id: 'body_refinement', name: '炼体诀', icon: '💪', cost: 200, effect: { hp: 50, power: 10 }, desc: '生命+50, 战力+10' },
  { id: 'spirit_gathering', name: '聚灵阵', icon: '✨', cost: 500, effect: { qiMult: 2 }, desc: '灵气获取翻倍' },
  { id: 'alchemy_master', name: '丹道真解', icon: '🔥', cost: 300, effect: { alchemySuccess: 0.2 }, desc: '炼丹成功率+20%' },
  { id: 'treasure_hunter', name: '寻宝诀', icon: '🗺️', cost: 400, effect: { lootMult: 1.5 }, desc: '探索奖励+50%' },
  { id: 'immortal_body', name: '不灭金身', icon: '🛡️', cost: 1000, effect: { hp: 200, power: 50 }, desc: '生命+200, 战力+50' },
  { id: 'heavenly_thunder', name: '九天雷法', icon: '⚡', cost: 800, effect: { skillDamage: 50 }, desc: '法术伤害+50' }
];

const ITEMS = {
  qi_pill: { name: '聚气丹', icon: '💊', effect: { qi: 100 } },
  exp_pill: { name: '悟道丹', icon: '🌟', effect: { exp: 200 } },
  life_pill: { name: '延寿丹', icon: '🌿', effect: { maxAge: 50 } },
  power_pill: { name: '力量丹', icon: '⚔️', effect: { tempPower: 50 } },
  monster_core: { name: '妖丹', icon: '🔮', effect: { exp: 50 } },
  spirit_herb: { name: '灵草', icon: '🌿', effect: null },
  spirit_stone: { name: '灵石', icon: '💎', effect: null }
};

class XiuXianGame {
  constructor() {
    this.load();
    this.initUI();
    this.startLoop();
  }

  load() {
    const saved = localStorage.getItem('xiuxian_save');
    if (saved) {
      const data = JSON.parse(saved);
      this.player = data.player;
      this.inventory = data.inventory;
      this.learnedSkills = data.learnedSkills;
    } else {
      this.reset();
    }
  }

  save() {
    localStorage.setItem('xiuxian_save', JSON.stringify({
      player: this.player,
      inventory: this.inventory,
      learnedSkills: this.learnedSkills
    }));
  }

  reset() {
    this.player = {
      name: '无名散修',
      realmIndex: 0,
      qi: 0,
      exp: 0,
      age: 16,
      hp: 100,
      maxHp: 100,
      power: 10,
      qiMult: 1,
      lootMult: 1,
      alchemyBonus: 0,
      skillDamage: 0,
      tempPower: 0,
      isCultivating: false,
      secluded: false,
      secludedTime: 0
    };
    this.inventory = {
      stones: 10,
      herbs: 5,
      cores: 0,
      items: {}
    };
    this.learnedSkills = ['basic_cultivation'];
    this.currentEnemy = null;
    this.save();
  }

  get realm() { return REALMS[this.player.realmIndex]; }
  get nextRealm() { return REALMS[this.player.realmIndex + 1]; }

  initUI() {
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => this.switchTab(btn.dataset.tab));
    });

    document.getElementById('meditationCircle').addEventListener('click', () => this.cultivate());

    this.renderLocations();
    this.renderRecipes();
    this.renderSkills();
    this.updateUI();
  }

  switchTab(tabId) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
    document.querySelector(`[data-tab="${tabId}"]`).classList.add('active');
    document.getElementById(tabId).classList.add('active');
  }

  renderLocations() {
    const container = document.getElementById('locationList');
    container.innerHTML = LOCATIONS.map(loc => `
      <div class="location-card" onclick="game.explore('${loc.id}')">
        <h4>${loc.name}</h4>
        <p>危险等级: ${'⭐'.repeat(loc.danger)}</p>
        <p>推荐战力: ${loc.danger * 50}</p>
      </div>
    `).join('');
  }

  renderRecipes() {
    const container = document.getElementById('recipeList');
    container.innerHTML = RECIPES.map(recipe => `
      <div class="recipe-card" onclick="game.alchemy('${recipe.id}')">
        <h4>${recipe.icon} ${recipe.name}</h4>
        <p>${recipe.desc}</p>
        <p>材料: 灵草x${recipe.herbs} 灵石x${recipe.stones}${recipe.cores ? ` 妖丹x${recipe.cores}` : ''}</p>
      </div>
    `).join('');
  }

  renderSkills() {
    const container = document.getElementById('skillList');
    const learned = document.getElementById('learnedSkills');

    container.innerHTML = SKILLS.filter(s => !this.learnedSkills.includes(s.id)).map(skill => `
      <div class="skill-card" onclick="game.learnSkill('${skill.id}')">
        <h4>${skill.icon} ${skill.name}</h4>
        <p>${skill.desc}</p>
        <p>费用: ${skill.cost}灵石 ${this.inventory.stones >= skill.cost ? '✅' : '❌'}</p>
      </div>
    `).join('');

    learned.innerHTML = this.learnedSkills.map(id => {
      const skill = SKILLS.find(s => s.id === id);
      return `<div class="skill-card"><h4>${skill.icon} ${skill.name}</h4><p>${skill.desc}</p></div>`;
    }).join('');
  }

  updateUI() {
    const realm = this.realm;
    document.getElementById('playerName').textContent = this.player.name;
    document.getElementById('realm').textContent = realm.name;
    document.getElementById('age').textContent = Math.floor(this.player.age);
    document.getElementById('maxAge').textContent = realm.maxAge;

    const qiPercent = Math.min(100, (this.player.qi / realm.qiReq) * 100);
    document.getElementById('qiBar').style.width = qiPercent + '%';
    document.getElementById('qiText').textContent = `${Math.floor(this.player.qi)}/${realm.qiReq}`;

    const expPercent = Math.min(100, (this.player.exp / realm.expReq) * 100);
    document.getElementById('expBar').style.width = expPercent + '%';
    document.getElementById('expText').textContent = `${Math.floor(this.player.exp)}/${realm.expReq}`;

    const baseQiPerSec = 1 + this.player.realmIndex * 2;
    const qiPerSec = Math.floor(baseQiPerSec * this.player.qiMult);
    document.getElementById('efficiency').textContent = this.player.qiMult.toFixed(1);
    document.getElementById('qiPerSec').textContent = qiPerSec;

    document.getElementById('spiritStones').textContent = this.inventory.stones;
    document.getElementById('herbs').textContent = this.inventory.herbs;
    document.getElementById('monsterCores').textContent = this.inventory.cores;

    const canBreakthrough = this.player.qi >= realm.qiReq && this.player.exp >= realm.expReq;
    document.getElementById('breakthroughBtn').disabled = !canBreakthrough || !this.nextRealm;

    this.renderInventory();
    this.renderSkills();
  }

  renderInventory() {
    const container = document.getElementById('itemGrid');
    const items = Object.entries(this.inventory.items).filter(([_, count]) => count > 0);

    if (items.length === 0) {
      container.innerHTML = '<p style="color:#888;text-align:center;width:100%">背包空空如也</p>';
      return;
    }

    container.innerHTML = items.map(([id, count]) => {
      const item = ITEMS[id];
      return `
        <div class="item-card" onclick="game.useItem('${id}')">
          <span class="icon">${item.icon}</span>
          <div>${item.name}</div>
          <div class="count">x${count}</div>
        </div>
      `;
    }).join('');
  }

  log(message) {
    const logDiv = document.getElementById('gameLog');
    const p = document.createElement('p');
    p.textContent = `[${Math.floor(this.player.age)}岁] ${message}`;
    logDiv.insertBefore(p, logDiv.firstChild);
    if (logDiv.children.length > 50) logDiv.removeChild(logDiv.lastChild);
  }

  cultivate() {
    if (this.player.secluded) return;

    this.player.isCultivating = !this.player.isCultivating;
    const circle = document.getElementById('meditationCircle');
    const text = document.getElementById('meditationText');

    if (this.player.isCultivating) {
      circle.classList.add('cultivating');
      text.textContent = '修炼中';
      this.log('开始打坐修炼...');
    } else {
      circle.classList.remove('cultivating');
      text.textContent = '打坐';
      this.log('停止修炼。');
    }
  }

  secluded() {
    if (this.player.secluded) return;
    if (this.inventory.stones < 50) {
      this.log('灵石不足，需要50灵石闭关！');
      return;
    }

    this.inventory.stones -= 50;
    this.player.secluded = true;
    this.player.secludedTime = 0;
    this.player.isCultivating = true;
    this.log('开始闭关修炼，消耗50灵石...');
    this.updateUI();
  }

  breakthrough() {
    const realm = this.realm;
    if (this.player.qi < realm.qiReq || this.player.exp < realm.expReq) {
      this.log('修为不足，无法突破！');
      return;
    }

    if (!this.nextRealm) {
      this.log('已达最高境界！');
      return;
    }

    const successRate = 0.5 + (this.player.realmIndex * 0.05);
    const hasPill = this.inventory.items.breakthrough_pill > 0;

    if (hasPill) {
      this.inventory.items.breakthrough_pill--;
      this.log('使用破境丹辅助突破！');
    }

    if (Math.random() < successRate + (hasPill ? 0.3 : 0)) {
      this.player.realmIndex++;
      this.player.qi = 0;
      this.player.exp = 0;
      this.player.maxHp += 50;
      this.player.hp = this.player.maxHp;
      this.player.power += this.player.realmIndex * 10;
      this.log(`🎉 突破成功！晋升${this.realm.name}！`);
    } else {
      this.player.qi = Math.floor(this.player.qi * 0.5);
      this.player.exp = Math.floor(this.player.exp * 0.5);
      this.log('💥 突破失败！修为受损...');
    }

    this.save();
    this.updateUI();
  }

  explore(locationId) {
    const location = LOCATIONS.find(l => l.id === locationId);
    if (!location) return;

    const dangerPower = location.danger * 50;
    if (this.getTotalPower() < dangerPower * 0.5) {
      this.log(`⚠️ ${location.name}太危险了，建议战力${dangerPower}！`);
    }

    this.log(`前往${location.name}探索...`);

    if (Math.random() < 0.6) {
      const monsterName = location.monsters[Math.floor(Math.random() * location.monsters.length)];
      this.startBattle({
        name: monsterName,
        hp: dangerPower,
        maxHp: dangerPower,
        power: dangerPower * 0.8,
        location: location
      });
    } else {
      this.gatherRewards(location);
    }
  }

  getTotalPower() {
    let power = this.player.power + this.player.tempPower;
    this.learnedSkills.forEach(id => {
      const skill = SKILLS.find(s => s.id === id);
      if (skill.effect.power) power += skill.effect.power;
    });
    return Math.floor(power);
  }

  startBattle(enemy) {
    this.currentEnemy = enemy;
    document.getElementById('locationList').classList.add('hidden');
    document.getElementById('battleArea').classList.remove('hidden');
    document.getElementById('enemyName').textContent = enemy.name;
    this.updateBattleUI();
    this.log(`遭遇 ${enemy.name}！`);
  }

  updateBattleUI() {
    if (!this.currentEnemy) return;
    const enemy = this.currentEnemy;
    const hpPercent = (enemy.hp / enemy.maxHp) * 100;
    document.getElementById('enemyHpBar').style.width = hpPercent + '%';
    document.getElementById('enemyHpText').textContent = `${Math.floor(enemy.hp)}/${enemy.maxHp}`;
  }

  attack() {
    if (!this.currentEnemy) return;

    const damage = this.getTotalPower() * (0.8 + Math.random() * 0.4);
    this.currentEnemy.hp -= damage;
    this.addBattleLog(`你造成 ${Math.floor(damage)} 点伤害！`, 'damage');

    if (this.currentEnemy.hp <= 0) {
      this.victory();
      return;
    }

    this.enemyAttack();
    this.updateBattleUI();
  }

  useSkill() {
    if (!this.currentEnemy) return;

    const baseDamage = this.getTotalPower() * 1.5 + this.player.skillDamage;
    const damage = baseDamage * (0.9 + Math.random() * 0.2);
    this.currentEnemy.hp -= damage;
    this.addBattleLog(`施展法术，造成 ${Math.floor(damage)} 点伤害！`, 'damage');

    if (this.currentEnemy.hp <= 0) {
      this.victory();
      return;
    }

    this.enemyAttack();
    this.updateBattleUI();
  }

  enemyAttack() {
    const damage = this.currentEnemy.power * (0.5 + Math.random() * 0.5);
    this.player.hp -= damage;
    this.addBattleLog(`${this.currentEnemy.name}攻击，你受到 ${Math.floor(damage)} 点伤害！`, 'damage');

    if (this.player.hp <= 0) {
      this.player.hp = Math.floor(this.player.maxHp * 0.3);
      this.addBattleLog('你被击败了！', 'damage');
      this.flee();
    }
  }

  addBattleLog(text, type) {
    const log = document.getElementById('battleLog');
    const p = document.createElement('p');
    p.className = type;
    p.textContent = text;
    log.appendChild(p);
    log.scrollTop = log.scrollHeight;
  }

  flee() {
    this.currentEnemy = null;
    document.getElementById('battleArea').classList.add('hidden');
    document.getElementById('locationList').classList.remove('hidden');
    document.getElementById('battleLog').innerHTML = '';
    this.log('逃离战斗。');
  }

  victory() {
    const enemy = this.currentEnemy;
    const location = enemy.location;

    this.addBattleLog(`击败了 ${enemy.name}！`, 'info');

    const coreDrop = Math.random() < 0.3;
    if (coreDrop) {
      this.inventory.cores++;
      this.addBattleLog('获得妖丹x1！', 'heal');
    }

    this.gatherRewards(location);
    this.player.exp += location.danger * 20;
    this.log(`获得${location.danger * 20}修为！`);

    this.currentEnemy = null;
    setTimeout(() => {
      document.getElementById('battleArea').classList.add('hidden');
      document.getElementById('locationList').classList.remove('hidden');
      document.getElementById('battleLog').innerHTML = '';
    }, 1500);

    this.save();
    this.updateUI();
  }

  gatherRewards(location) {
    const mult = this.player.lootMult;
    const stones = Math.floor((Math.random() * (location.rewards.stones[1] - location.rewards.stones[0]) + location.rewards.stones[0]) * mult);
    const herbs = Math.floor((Math.random() * (location.rewards.herbs[1] - location.rewards.herbs[0]) + location.rewards.herbs[0]) * mult);

    if (stones > 0) {
      this.inventory.stones += stones;
      this.log(`获得灵石x${stones}！`);
    }
    if (herbs > 0) {
      this.inventory.herbs += herbs;
      this.log(`获得灵草x${herbs}！`);
    }
    if (location.rewards.cores && Math.random() < 0.2) {
      const cores = Math.floor(Math.random() * (location.rewards.cores[1] - location.rewards.cores[0]) + location.rewards.cores[0]);
      this.inventory.cores += cores;
      this.log(`获得妖丹x${cores}！`);
    }

    this.save();
    this.updateUI();
  }

  alchemy(recipeId) {
    const recipe = RECIPES.find(r => r.id === recipeId);
    if (!recipe) return;

    if (this.inventory.herbs < recipe.herbs || this.inventory.stones < recipe.stones ||
        (recipe.cores && this.inventory.cores < recipe.cores)) {
      this.log('材料不足！');
      return;
    }

    this.inventory.herbs -= recipe.herbs;
    this.inventory.stones -= recipe.stones;
    if (recipe.cores) this.inventory.cores -= recipe.cores;

    const successRate = 0.6 + this.player.alchemyBonus;
    if (Math.random() < successRate) {
      if (!this.inventory.items[recipeId]) this.inventory.items[recipeId] = 0;
      this.inventory.items[recipeId]++;
      this.log(`炼制 ${recipe.name} 成功！`);
      document.getElementById('alchemyStatus').textContent = `✅ 炼制成功！获得 ${recipe.name}`;
    } else {
      this.log('炼丹失败，材料损毁...');
      document.getElementById('alchemyStatus').textContent = '❌ 炼丹失败！';
    }

    this.save();
    this.updateUI();
  }

  useItem(itemId) {
    const item = ITEMS[itemId];
    if (!item || !item.effect) return;

    if (item.effect.qi) {
      this.player.qi += item.effect.qi;
      this.log(`使用 ${item.name}，获得${item.effect.qi}灵气！`);
    }
    if (item.effect.exp) {
      this.player.exp += item.effect.exp;
      this.log(`使用 ${item.name}，获得${item.effect.exp}修为！`);
    }
    if (item.effect.maxAge) {
      REALMS[this.player.realmIndex].maxAge += item.effect.maxAge;
      this.log(`使用 ${item.name}，延寿${item.effect.maxAge}年！`);
    }
    if (item.effect.tempPower) {
      this.player.tempPower += item.effect.tempPower;
      setTimeout(() => {
        this.player.tempPower -= item.effect.tempPower;
        this.updateUI();
      }, 60000);
      this.log(`使用 ${item.name}，战力临时提升${item.effect.tempPower}！`);
    }

    this.inventory.items[itemId]--;
    if (this.inventory.items[itemId] <= 0) delete this.inventory.items[itemId];

    this.save();
    this.updateUI();
  }

  learnSkill(skillId) {
    const skill = SKILLS.find(s => s.id === skillId);
    if (!skill || this.learnedSkills.includes(skillId)) return;

    if (this.inventory.stones < skill.cost) {
      this.log('灵石不足！');
      return;
    }

    this.inventory.stones -= skill.cost;
    this.learnedSkills.push(skillId);

    if (skill.effect.qiMult) this.player.qiMult *= skill.effect.qiMult;
    if (skill.effect.lootMult) this.player.lootMult *= skill.effect.lootMult;
    if (skill.effect.alchemySuccess) this.player.alchemyBonus += skill.effect.alchemySuccess;
    if (skill.effect.skillDamage) this.player.skillDamage += skill.effect.skillDamage;
    if (skill.effect.hp) {
      this.player.maxHp += skill.effect.hp;
      this.player.hp += skill.effect.hp;
    }

    this.log(`学会 ${skill.name}！`);
    this.save();
    this.updateUI();
  }

  startLoop() {
    setInterval(() => this.gameLoop(), 1000);
  }

  gameLoop() {
    const realm = this.realm;
    const baseQiGain = 1 + this.player.realmIndex * 2;

    if (this.player.isCultivating) {
      const qiGain = baseQiGain * this.player.qiMult * (this.player.secluded ? 3 : 1);
      this.player.qi += qiGain;
      this.player.exp += qiGain * 0.5;
    }

    if (this.player.secluded) {
      this.player.secludedTime++;
      if (this.player.secludedTime >= 60) {
        this.player.secluded = false;
        this.player.isCultivating = false;
        document.getElementById('meditationCircle').classList.remove('cultivating');
        document.getElementById('meditationText').textContent = '打坐';
        this.log('闭关结束！');
      }
    }

    this.player.age += 1 / (365 * 24);

    if (this.player.age >= realm.maxAge) {
      this.gameOver('寿元耗尽');
    }

    this.save();
    this.updateUI();
  }

  gameOver(reason) {
    document.getElementById('deathReason').textContent = reason;
    document.getElementById('finalRealm').textContent = this.realm.name;
    document.getElementById('finalAge').textContent = Math.floor(this.player.age);
    document.getElementById('gameOver').classList.remove('hidden');
    localStorage.removeItem('xiuxian_save');
  }

  restart() {
    this.reset();
    document.getElementById('gameOver').classList.add('hidden');
    this.updateUI();
    this.log('转世重修，再踏仙途！');
  }
}

const game = new XiuXianGame();
</script>

</main>

setTimeout(function(){if(window.CardSystem)CardSystem.unlock('gamer');else setTimeout(arguments.callee,500);},500);
</script>
