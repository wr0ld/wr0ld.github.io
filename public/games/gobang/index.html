<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五 五子棋 | wr0ld's Blog</title>
<style>
:root {
  color-scheme: dark;--bg:#0a0a0f;--card:#16162a;--t1:#f0f0f5;--t2:#8b8ba3;--accent:#6c5ce7;--border:rgba(255,255,255,.06)}
*{margin:0;padding:0;box-sizing:border-box}
  html{background:var(--bg)}
body{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t1);min-height:100vh}
.nav{position:sticky;top:0;z-index:100;backdrop-filter:blur(20px);background:rgba(10,10,15,.78);border-bottom:1px solid var(--border);padding:0 24px}
.nav-inner{max-width:900px;margin:0 auto;height:60px;display:flex;align-items:center;justify-content:space-between}
.nav-left{display:flex;align-items:center;gap:16px}
.logo{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-weight:700;font-size:1.15rem;text-decoration:none;color:#a29bfe}
.nav-back{color:var(--t2);text-decoration:none;font-size:.85rem;padding:6px 14px;border-radius:8px;border:1px solid var(--border);transition:.2s}
.nav-back:hover{color:var(--t1);background:rgba(255,255,255,.05)}

.main{max-width:800px;margin:0 auto;padding:36px 20px 60px;text-align:center}

/* 游戏容器样式覆盖 */
.game-container { max-width: 100%; margin: 0 auto; padding: 0; text-align: center; }
.game-header h1 { font-size: 2em; margin-bottom: 22px; font-weight: 700; }
.game-controls { margin: 18px 0; }
.game-controls button { padding: 10px 24px; margin: 0 8px; font-size: 15px; cursor: pointer; background: linear-gradient(135deg,#6c5ce7,#a29bfe); color: #fff; border: none; border-radius: 10px; font-weight: 600; transition: .25s; }
.game-controls button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(108,92,231,.4); }
.game-controls button:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
.game-controls select { padding: 10px 14px; font-size: 15px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--t1); outline: none; }

.game-info { display: flex; justify-content: center; gap: 20px; margin: 16px 0; font-size: 16px; color: var(--t2); flex-wrap: wrap; }
.game-info span { color: var(--accent); font-weight: 500; }
.game-board-container { position: relative; display: inline-block; margin: 18px 0; }

#gameCanvas, #nextCanvas { border: 2px solid rgba(108,92,231,.3); border-radius: 12px; display: block; }

.game-over, .game-win {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  background: rgba(10,10,15,.95); color: #fff; padding: 34px 44px;
  border-radius: 16px; text-align: center; border: 1px solid var(--border);
  backdrop-filter: blur(12px); z-index: 10;
}
.game-over.hidden, .game-win.hidden { display: none !important; }
.game-over h2, .game-win h2 { font-size: 1.6em; margin-bottom: 14px; color: #e74c3c; }
.game-over p, .game-win p { margin-bottom: 18px; color: var(--t2); font-size: 1.05em; }
.game-over button, .game-win button {
  padding: 11px 28px; font-size: 15px; cursor: pointer;
  background: linear-gradient(135deg,#6c5ce7,#a29bfe); color: #fff;
  border: none; border-radius: 10px; font-weight: 600;
}

.game-instructions {
  margin-top: 32px; text-align: left; padding: 22px 26px;
  background: var(--card); border-radius: 14px; border: 1px solid var(--border);
}
.game-instructions h3 { margin-bottom: 14px; color: var(--accent); font-size: 1.05em; }
.game-instructions ul { list-style: none; padding: 0; }
.game-instructions li { padding: 7px 0 7px 22px; position: relative; color: var(--t2); font-size: .9rem; line-height: 1.5; }
.game-instructions li::before { content: '▸'; position: absolute; left: 0; color: var(--accent); font-weight: bold; }

@media(max-width:640px){
  .nav-inner{height:52px;padding:0 16px}
  .main{padding:24px 16px 40px}
  #gameCanvas{max-width:100%;height:auto!important}
  .game-info{gap:12px;font-size:14px}
  .game-board-container{overflow-x:auto}
}
</style>
</head>
<body>
<nav class="nav"><div class="nav-inner"><div class="nav-left"><a href="/games/" class="logo">🎮 GAME</a><a href="/games/" class="nav-back">← 返回</a></div></div></nav>

<main class="main">


<div class="game-container">
  <div class="game-header">
    <h1>⚫⚪ 五子棋</h1>
    <div class="game-controls">
      <button onclick="newGame()">新游戏</button>
    </div>
    <div class="game-info">
      <div class="current-player">当前: <span id="currentPlayer">你的回合</span></div>
      <div class="game-status" id="gameStatus"></div>
    </div>
  </div>
  
  <div class="game-board-container">
    <canvas id="gameCanvas" width="600" height="600"></canvas>
    <div id="gameOver" class="game-over hidden">
      <h2 id="winnerText">游戏结束!</h2>
      <button onclick="newGame()">再来一局</button>
    </div>
  </div>
  
  <div class="game-instructions">
    <h3>游戏说明</h3>
    <ul>
      <li>你执黑棋，AI执白棋</li>
      <li>点击棋盘空位落子</li>
      <li>先连成五子一线者获胜</li>
      <li>横、竖、斜均可连成五子</li>
    </ul>
  </div>
</div>

<style>
  .game-container {
    max-width: 700px;
    margin: 0 auto;
    padding: 20px;
    text-align: center;
  }
  
  .game-header h1 {
    font-size: 2.5em;
    margin-bottom: 20px;
  }
  
  .game-controls {
    margin: 20px 0;
  }
  
  .game-controls button {
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
    background: #6c5ce7;
    color: white;
    border: none;
    border-radius: 5px;
    transition: all 0.3s;
  }
  
  .game-controls button:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
  }
  
  .game-info {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin: 20px 0;
    font-size: 18px;
  }
  
  .game-status {
    color: #6c5ce7;
    font-weight: bold;
  }
  
  .game-board-container {
    position: relative;
    display: inline-block;
    margin: 20px 0;
  }
  
  #gameCanvas {
    border: 3px solid #f0f0f5;
    background: #dcb35c;
    display: block;
    cursor: pointer;
  }
  
  .game-over {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.9);
    color: white;
    padding: 30px;
    border-radius: 10px;
    text-align: center;
  }
  
  .game-over.hidden {
    display: none;
  }
  
  .game-over button {
    margin-top: 15px;
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
    background: #6c5ce7;
    color: white;
    border: none;
    border-radius: 5px;
  }
  
  .game-instructions {
    margin-top: 30px;
    text-align: left;
    padding: 20px;
    background: #16162a;
    border-radius: 10px;
  }
  
  .game-instructions h3 {
    margin-bottom: 15px;
  }
  
  .game-instructions ul {
    list-style: none;
    padding: 0;
  }
  
  .game-instructions li {
    padding: 8px 0;
    padding-left: 20px;
    position: relative;
  }
  
  .game-instructions li:before {
    content: "•";
    position: absolute;
    left: 0;
    color: #6c5ce7;
  }
</style>

<script>
  const gobangCanvas = document.getElementById('gameCanvas');
  const gobangCtx = gobangCanvas.getContext('2d');
  
  const BOARD_SIZE = 15;
  const CELL_SIZE = 40;
  const PLAYER = 1;  // 黑棋 - 玩家
  const AI = 2;      // 白棋 - AI
  
  let board = [];
  let gameOver = false;
  let lastMove = null;
  let isPlayerTurn = true;
  
  function initBoard() {
    board = [];
    for (let i = 0; i < BOARD_SIZE; i++) {
      board[i] = [];
      for (let j = 0; j < BOARD_SIZE; j++) {
        board[i][j] = 0;
      }
    }
  }
  
  function drawBoard() {
    gobangCtx.clearRect(0, 0, gobangCanvas.width, gobangCanvas.height);
    
    gobangCtx.fillStyle = '#dcb35c';
    gobangCtx.fillRect(0, 0, gobangCanvas.width, gobangCanvas.height);
    
    gobangCtx.strokeStyle = '#000';
    gobangCtx.lineWidth = 1;
    
    for (let i = 0; i < BOARD_SIZE; i++) {
      gobangCtx.beginPath();
      gobangCtx.moveTo(CELL_SIZE / 2, CELL_SIZE / 2 + i * CELL_SIZE);
      gobangCtx.lineTo(gobangCanvas.width - CELL_SIZE / 2, CELL_SIZE / 2 + i * CELL_SIZE);
      gobangCtx.stroke();
      
      gobangCtx.beginPath();
      gobangCtx.moveTo(CELL_SIZE / 2 + i * CELL_SIZE, CELL_SIZE / 2);
      gobangCtx.lineTo(CELL_SIZE / 2 + i * CELL_SIZE, gobangCanvas.height - CELL_SIZE / 2);
      gobangCtx.stroke();
    }
    
    const starPoints = [
      [3, 3], [3, 11], [11, 3], [11, 11], [7, 7],
      [3, 7], [11, 7], [7, 3], [7, 11]
    ];
    
    gobangCtx.fillStyle = '#000';
    for (let point of starPoints) {
      gobangCtx.beginPath();
      gobangCtx.arc(
        CELL_SIZE / 2 + point[0] * CELL_SIZE,
        CELL_SIZE / 2 + point[1] * CELL_SIZE,
        4,
        0,
        Math.PI * 2
      );
      gobangCtx.fill();
    }
    
    for (let i = 0; i < BOARD_SIZE; i++) {
      for (let j = 0; j < BOARD_SIZE; j++) {
        if (board[i][j] !== 0) {
          drawPiece(i, j, board[i][j]);
        }
      }
    }
    
    if (lastMove) {
      gobangCtx.strokeStyle = '#ff0000';
      gobangCtx.lineWidth = 2;
      gobangCtx.beginPath();
      gobangCtx.arc(
        CELL_SIZE / 2 + lastMove.x * CELL_SIZE,
        CELL_SIZE / 2 + lastMove.y * CELL_SIZE,
        CELL_SIZE / 2 - 5,
        0,
        Math.PI * 2
      );
      gobangCtx.stroke();
    }
  }
  
  function drawPiece(x, y, player) {
    const centerX = CELL_SIZE / 2 + x * CELL_SIZE;
    const centerY = CELL_SIZE / 2 + y * CELL_SIZE;
    const radius = CELL_SIZE / 2 - 3;
    
    gobangCtx.beginPath();
    gobangCtx.arc(centerX, centerY, radius, 0, Math.PI * 2);
    
    if (player === PLAYER) {
      const gradient = gobangCtx.createRadialGradient(
        centerX - 5, centerY - 5, 0,
        centerX, centerY, radius
      );
      gradient.addColorStop(0, '#666');
      gradient.addColorStop(1, '#000');
      gobangCtx.fillStyle = gradient;
    } else {
      const gradient = gobangCtx.createRadialGradient(
        centerX - 5, centerY - 5, 0,
        centerX, centerY, radius
      );
      gradient.addColorStop(0, '#fff');
      gradient.addColorStop(1, '#ddd');
      gobangCtx.fillStyle = gradient;
    }
    
    gobangCtx.fill();
    gobangCtx.strokeStyle = '#000';
    gobangCtx.lineWidth = 1;
    gobangCtx.stroke();
  }
  
  function getGridPosition(clientX, clientY) {
    const rect = gobangCanvas.getBoundingClientRect();
    const x = clientX - rect.left;
    const y = clientY - rect.top;
    
    const gridX = Math.round((x - CELL_SIZE / 2) / CELL_SIZE);
    const gridY = Math.round((y - CELL_SIZE / 2) / CELL_SIZE);
    
    if (gridX >= 0 && gridX < BOARD_SIZE && gridY >= 0 && gridY < BOARD_SIZE) {
      return { x: gridX, y: gridY };
    }
    return null;
  }
  
  function checkWin(x, y, player) {
    const directions = [
      [1, 0],
      [0, 1],
      [1, 1],
      [1, -1]
    ];
    
    for (let [dx, dy] of directions) {
      let count = 1;
      
      for (let i = 1; i < 5; i++) {
        const nx = x + dx * i;
        const ny = y + dy * i;
        if (nx >= 0 && nx < BOARD_SIZE && ny >= 0 && ny < BOARD_SIZE && board[nx][ny] === player) {
          count++;
        } else {
          break;
        }
      }
      
      for (let i = 1; i < 5; i++) {
        const nx = x - dx * i;
        const ny = y - dy * i;
        if (nx >= 0 && nx < BOARD_SIZE && ny >= 0 && ny < BOARD_SIZE && board[nx][ny] === player) {
          count++;
        } else {
          break;
        }
      }
      
      if (count >= 5) {
        return true;
      }
    }
    
    return false;
  }
  
  function evaluatePoint(x, y, player) {
    if (board[x][y] !== 0) return 0;
    
    let score = 0;
    const directions = [[1, 0], [0, 1], [1, 1], [1, -1]];
    
    for (let [dx, dy] of directions) {
      let count = 1;
      let block = 0;
      let empty = 0;
      
      for (let i = 1; i <= 4; i++) {
        const nx = x + dx * i;
        const ny = y + dy * i;
        if (nx < 0 || nx >= BOARD_SIZE || ny < 0 || ny >= BOARD_SIZE) {
          block++;
          break;
        }
        if (board[nx][ny] === player) {
          count++;
        } else if (board[nx][ny] === 0) {
          empty++;
          break;
        } else {
          block++;
          break;
        }
      }
      
      for (let i = 1; i <= 4; i++) {
        const nx = x - dx * i;
        const ny = y - dy * i;
        if (nx < 0 || nx >= BOARD_SIZE || ny < 0 || ny >= BOARD_SIZE) {
          block++;
          break;
        }
        if (board[nx][ny] === player) {
          count++;
        } else if (board[nx][ny] === 0) {
          empty++;
          break;
        } else {
          block++;
          break;
        }
      }
      
      if (count >= 5) {
        score += 100000;
      } else if (count === 4) {
        if (block === 0) score += 10000;
        else if (block === 1) score += 1000;
      } else if (count === 3) {
        if (block === 0) score += 1000;
        else if (block === 1) score += 100;
      } else if (count === 2) {
        if (block === 0) score += 100;
        else if (block === 1) score += 10;
      }
    }
    
    return score;
  }
  
  function aiMove() {
    let bestScore = -1;
    let bestMoves = [];
    
    for (let i = 0; i < BOARD_SIZE; i++) {
      for (let j = 0; j < BOARD_SIZE; j++) {
        if (board[i][j] === 0) {
          let hasNeighbor = false;
          for (let di = -2; di <= 2; di++) {
            for (let dj = -2; dj <= 2; dj++) {
              const ni = i + di;
              const nj = j + dj;
              if (ni >= 0 && ni < BOARD_SIZE && nj >= 0 && nj < BOARD_SIZE && board[ni][nj] !== 0) {
                hasNeighbor = true;
                break;
              }
            }
            if (hasNeighbor) break;
          }
          
          if (!hasNeighbor && board[7][7] === 0) {
            bestMoves = [{x: 7, y: 7}];
            break;
          }
          
          if (hasNeighbor) {
            const attackScore = evaluatePoint(i, j, AI);
            const defendScore = evaluatePoint(i, j, PLAYER);
            const score = attackScore + defendScore * 0.8;
            
            if (score > bestScore) {
              bestScore = score;
              bestMoves = [{x: i, y: j}];
            } else if (score === bestScore) {
              bestMoves.push({x: i, y: j});
            }
          }
        }
      }
      if (bestMoves.length > 0 && !bestMoves[0].hasNeighbor) break;
    }
    
    if (bestMoves.length === 0) {
      for (let i = 0; i < BOARD_SIZE; i++) {
        for (let j = 0; j < BOARD_SIZE; j++) {
          if (board[i][j] === 0) {
            bestMoves.push({x: i, y: j});
          }
        }
      }
    }
    
    const move = bestMoves[Math.floor(Math.random() * bestMoves.length)];
    board[move.x][move.y] = AI;
    lastMove = move;
    
    drawBoard();
    
    if (checkWin(move.x, move.y, AI)) {
      gameOver = true;
      document.getElementById('winnerText').textContent = 'AI获胜!';
      document.getElementById('gameOver').classList.remove('hidden');
      document.getElementById('currentPlayer').textContent = '游戏结束';
    } else {
      isPlayerTurn = true;
      document.getElementById('currentPlayer').textContent = '你的回合';
    }
  }
  
  function handleClick(e) {
    if (gameOver || !isPlayerTurn) return;
    
    const pos = getGridPosition(e.clientX, e.clientY);
    if (!pos) return;
    
    if (board[pos.x][pos.y] === 0) {
      board[pos.x][pos.y] = PLAYER;
      lastMove = pos;
      
      drawBoard();
      
      if (checkWin(pos.x, pos.y, PLAYER)) {
        gameOver = true;
        document.getElementById('winnerText').textContent = '你赢了!';
        document.getElementById('gameOver').classList.remove('hidden');
        document.getElementById('currentPlayer').textContent = '游戏结束';
      } else {
        let isDraw = true;
        for (let i = 0; i < BOARD_SIZE; i++) {
          for (let j = 0; j < BOARD_SIZE; j++) {
            if (board[i][j] === 0) {
              isDraw = false;
              break;
            }
          }
          if (!isDraw) break;
        }
        
        if (isDraw) {
          gameOver = true;
          document.getElementById('winnerText').textContent = '平局!';
          document.getElementById('gameOver').classList.remove('hidden');
          document.getElementById('currentPlayer').textContent = '游戏结束';
        } else {
          isPlayerTurn = false;
          document.getElementById('currentPlayer').textContent = 'AI思考中...';
          setTimeout(aiMove, 300);
        }
      }
    }
  }
  
  function newGame() {
    initBoard();
    gameOver = false;
    lastMove = null;
    isPlayerTurn = true;
    
    document.getElementById('currentPlayer').textContent = '你的回合';
    document.getElementById('gameStatus').textContent = '';
    document.getElementById('gameOver').classList.add('hidden');
    
    drawBoard();
  }
  
  gobangCanvas.addEventListener('click', handleClick);
  
  newGame();
</script>

</main>
