<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>接 接金币 | wr0ld's Blog</title>
<style>
:root {
  color-scheme: dark;--bg:#0a0a0f;--card:#16162a;--t1:#f0f0f5;--t2:#8b8ba3;--accent:#6c5ce7;--border:rgba(255,255,255,.06)}
*{margin:0;padding:0;box-sizing:border-box}
  html{background:var(--bg)}
body{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t1);min-height:100vh}
.nav{position:sticky;top:0;z-index:100;backdrop-filter:blur(20px);background:rgba(10,10,15,.78);border-bottom:1px solid var(--border);padding:0 24px}
.nav-inner{max-width:900px;margin:0 auto;height:60px;display:flex;align-items:center;justify-content:space-between}
.nav-left{display:flex;align-items:center;gap:16px}
.logo{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-weight:700;font-size:1.15rem;text-decoration:none;color:#a29bfe}
.nav-back{color:var(--t2);text-decoration:none;font-size:.85rem;padding:6px 14px;border-radius:8px;border:1px solid var(--border);transition:.2s}
.nav-back:hover{color:var(--t1);background:rgba(255,255,255,.05)}

.main{max-width:800px;margin:0 auto;padding:36px 20px 60px;text-align:center}

/* 游戏容器样式覆盖 */
.game-container { max-width: 100%; margin: 0 auto; padding: 0; text-align: center; }
.game-header h1 { font-size: 2em; margin-bottom: 22px; font-weight: 700; }
.game-controls { margin: 18px 0; }
.game-controls button { padding: 10px 24px; margin: 0 8px; font-size: 15px; cursor: pointer; background: linear-gradient(135deg,#6c5ce7,#a29bfe); color: #fff; border: none; border-radius: 10px; font-weight: 600; transition: .25s; }
.game-controls button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(108,92,231,.4); }
.game-controls button:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
.game-controls select { padding: 10px 14px; font-size: 15px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--t1); outline: none; }

.game-info { display: flex; justify-content: center; gap: 20px; margin: 16px 0; font-size: 16px; color: var(--t2); flex-wrap: wrap; }
.game-info span { color: var(--accent); font-weight: 500; }
.game-board-container { position: relative; display: inline-block; margin: 18px 0; }

#gameCanvas, #nextCanvas { border: 2px solid rgba(108,92,231,.3); border-radius: 12px; display: block; }

.game-over, .game-win {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  background: rgba(10,10,15,.95); color: #fff; padding: 34px 44px;
  border-radius: 16px; text-align: center; border: 1px solid var(--border);
  backdrop-filter: blur(12px); z-index: 10;
}
.game-over.hidden, .game-win.hidden { display: none !important; }
.game-over h2, .game-win h2 { font-size: 1.6em; margin-bottom: 14px; color: #e74c3c; }
.game-over p, .game-win p { margin-bottom: 18px; color: var(--t2); font-size: 1.05em; }
.game-over button, .game-win button {
  padding: 11px 28px; font-size: 15px; cursor: pointer;
  background: linear-gradient(135deg,#6c5ce7,#a29bfe); color: #fff;
  border: none; border-radius: 10px; font-weight: 600;
}

.game-instructions {
  margin-top: 32px; text-align: left; padding: 22px 26px;
  background: var(--card); border-radius: 14px; border: 1px solid var(--border);
}
.game-instructions h3 { margin-bottom: 14px; color: var(--accent); font-size: 1.05em; }
.game-instructions ul { list-style: none; padding: 0; }
.game-instructions li { padding: 7px 0 7px 22px; position: relative; color: var(--t2); font-size: .9rem; line-height: 1.5; }
.game-instructions li::before { content: '▸'; position: absolute; left: 0; color: var(--accent); font-weight: bold; }

@media(max-width:640px){
  .nav-inner{height:52px;padding:0 16px}
  .main{padding:24px 16px 40px}
  #gameCanvas{max-width:100%;height:auto!important}
  .game-info{gap:12px;font-size:14px}
  .game-board-container{overflow-x:auto}
}
</style>
</head>
<body>
<nav class="nav"><div class="nav-inner"><div class="nav-left"><a href="/games/" class="logo">🎮 GAME</a><a href="/games/" class="nav-back">← 返回</a></div></div></nav>

<main class="main">

<div class="game-container">
  <div class="game-header">
    <h1>💰 接金币</h1>
    <div class="game-controls">
      <button id="startBtn" onclick="startGame()">开始游戏</button>
    </div>
    <div class="game-info">
      <div class="score">得分: <span id="score">0</span></div>
      <div class="lives">生命: <span id="lives">❤️❤️❤️</span></div>
    </div>
  </div>
  
  <div class="game-board-container">
    <canvas id="gameCanvas" width="400" height="500"></canvas>
    <div id="gameOver" class="game-over hidden">
      <h2>游戏结束!</h2>
      <p>最终得分: <span id="finalScore">0</span></p>
      <button onclick="startGame()">再玩一次</button>
    </div>
  </div>
  
  <div class="game-instructions">
    <h3>游戏说明</h3>
    <ul>
      <li>使用鼠标或触摸屏左右移动篮子</li>
      <li>接住掉落的金币得分</li>
      <li>接住钻石获得更高分数</li>
      <li>避开炸弹，碰到炸弹失去一条命</li>
      <li>生命耗尽游戏结束</li>
    </ul>
  </div>
</div>

<style>
  .game-container {
    max-width: 500px;
    margin: 0 auto;
    padding: 20px;
    text-align: center;
  }
  
  .game-header h1 {
    font-size: 2em;
    margin-bottom: 20px;
  }
  
  .game-controls {
    margin: 20px 0;
  }
  
  .game-controls button {
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
    background: #6c5ce7;
    color: white;
    border: none;
    border-radius: 5px;
    transition: all 0.3s;
  }
  
  .game-controls button:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
  }
  
  .game-controls button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  
  .game-info {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin: 20px 0;
    font-size: 18px;
  }
  
  .game-board-container {
    position: relative;
    display: inline-block;
    margin: 20px 0;
  }
  
  #gameCanvas {
    border: 3px solid #f0f0f5;
    background: linear-gradient(to bottom, #1a1a2e, #16213e);
    display: block;
  }
  
  .game-over {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.9);
    color: white;
    padding: 30px;
    border-radius: 10px;
    text-align: center;
  }
  
  .game-over.hidden {
    display: none;
  }
  
  .game-over button {
    margin-top: 15px;
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
    background: #6c5ce7;
    color: white;
    border: none;
    border-radius: 5px;
  }
  
  .game-instructions {
    margin-top: 30px;
    text-align: left;
    padding: 20px;
    background: #16162a;
    border-radius: 10px;
  }
  
  .game-instructions h3 {
    margin-bottom: 15px;
  }
  
  .game-instructions ul {
    list-style: none;
    padding: 0;
  }
  
  .game-instructions li {
    padding: 8px 0;
    padding-left: 20px;
    position: relative;
  }
  
  .game-instructions li:before {
    content: "•";
    position: absolute;
    left: 0;
    color: #6c5ce7;
  }
</style>

<script>
  const catchCanvas = document.getElementById('gameCanvas');
  const catchCtx = catchCanvas.getContext('2d');
  
  let basket = { x: 200, y: 450, width: 80, height: 40 };
  let items = [];
  let score = 0;
  let lives = 3;
  let gameRunning = false;
  let gameLoop = null;
  let spawnTimer = null;
  let difficulty = 1;
  let particles = [];
  
  const ITEM_TYPES = {
    COIN: { color: '#f1c40f', points: 10, radius: 15 },
    DIAMOND: { color: '#3498db', points: 30, radius: 12 },
    BOMB: { color: '#e74c3c', points: -1, radius: 18 }
  };
  
  function initGame() {
    score = 0;
    lives = 3;
    difficulty = 1;
    items = [];
    particles = [];
    basket.x = catchCanvas.width / 2 - basket.width / 2;
    
    document.getElementById('score').textContent = score;
    updateLives();
    document.getElementById('gameOver').classList.add('hidden');
  }
  
  function updateLives() {
    document.getElementById('lives').textContent = '❤️'.repeat(lives);
  }
  
  function spawnItem() {
    const rand = Math.random();
    let type;
    
    if (rand < 0.1) {
      type = 'BOMB';
    } else if (rand < 0.25) {
      type = 'DIAMOND';
    } else {
      type = 'COIN';
    }
    
    items.push({
      x: Math.random() * (catchCanvas.width - 40) + 20,
      y: -20,
      type: type,
      ...ITEM_TYPES[type],
      vy: 2 + difficulty * 0.5,
      rotation: 0
    });
  }
  
  function createParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      particles.push({
        x: x,
        y: y,
        vx: (Math.random() - 0.5) * 8,
        vy: (Math.random() - 0.5) * 8 - 2,
        radius: Math.random() * 4 + 2,
        color: color,
        alpha: 1
      });
    }
  }
  
  function draw() {
    catchCtx.clearRect(0, 0, catchCanvas.width, catchCanvas.height);
    
    const gradient = catchCtx.createLinearGradient(0, 0, 0, catchCanvas.height);
    gradient.addColorStop(0, '#1a1a2e');
    gradient.addColorStop(1, '#16213e');
    catchCtx.fillStyle = gradient;
    catchCtx.fillRect(0, 0, catchCanvas.width, catchCanvas.height);
    
    for (let i = 0; i < 50; i++) {
      catchCtx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.5})`;
      catchCtx.beginPath();
      catchCtx.arc(
        Math.random() * catchCanvas.width,
        Math.random() * catchCanvas.height,
        Math.random() * 2,
        0, Math.PI * 2
      );
      catchCtx.fill();
    }
    
    items.forEach(item => {
      catchCtx.save();
      catchCtx.translate(item.x, item.y);
      catchCtx.rotate(item.rotation);
      
      if (item.type === 'COIN') {
        const coinGradient = catchCtx.createRadialGradient(0, 0, 0, 0, 0, item.radius);
        coinGradient.addColorStop(0, '#fff');
        coinGradient.addColorStop(0.3, item.color);
        coinGradient.addColorStop(1, '#c9a227');
        catchCtx.fillStyle = coinGradient;
        catchCtx.beginPath();
        catchCtx.arc(0, 0, item.radius, 0, Math.PI * 2);
        catchCtx.fill();
        
        catchCtx.fillStyle = '#c9a227';
        catchCtx.font = 'bold 14px Arial';
        catchCtx.textAlign = 'center';
        catchCtx.textBaseline = 'middle';
        catchCtx.fillText('$', 0, 0);
      } else if (item.type === 'DIAMOND') {
        catchCtx.fillStyle = item.color;
        catchCtx.beginPath();
        catchCtx.moveTo(0, -item.radius);
        catchCtx.lineTo(item.radius, 0);
        catchCtx.lineTo(0, item.radius);
        catchCtx.lineTo(-item.radius, 0);
        catchCtx.closePath();
        catchCtx.fill();
        
        catchCtx.fillStyle = 'rgba(255,255,255,0.5)';
        catchCtx.beginPath();
        catchCtx.moveTo(0, -item.radius);
        catchCtx.lineTo(item.radius * 0.3, -item.radius * 0.3);
        catchCtx.lineTo(0, 0);
        catchCtx.lineTo(-item.radius * 0.3, -item.radius * 0.3);
        catchCtx.closePath();
        catchCtx.fill();
      } else if (item.type === 'BOMB') {
        catchCtx.fillStyle = '#333';
        catchCtx.beginPath();
        catchCtx.arc(0, 0, item.radius, 0, Math.PI * 2);
        catchCtx.fill();
        
        catchCtx.fillStyle = '#e74c3c';
        catchCtx.beginPath();
        catchCtx.arc(0, 0, item.radius - 3, 0, Math.PI * 2);
        catchCtx.fill();
        
        catchCtx.fillStyle = '#333';
        catchCtx.fillRect(-3, -item.radius - 8, 6, 10);
        
        catchCtx.fillStyle = '#f39c12';
        catchCtx.beginPath();
        catchCtx.arc(0, -item.radius - 10, 5, 0, Math.PI * 2);
        catchCtx.fill();
      }
      
      catchCtx.restore();
    });
    
    catchCtx.fillStyle = '#8B4513';
    catchCtx.beginPath();
    catchCtx.moveTo(basket.x, basket.y + basket.height);
    catchCtx.lineTo(basket.x + basket.width, basket.y + basket.height);
    catchCtx.lineTo(basket.x + basket.width - 10, basket.y);
    catchCtx.lineTo(basket.x + 10, basket.y);
    catchCtx.closePath();
    catchCtx.fill();
    
    catchCtx.strokeStyle = '#654321';
    catchCtx.lineWidth = 2;
    catchCtx.stroke();
    
    catchCtx.fillStyle = '#654321';
    catchCtx.fillRect(basket.x + 5, basket.y + basket.height - 5, basket.width - 10, 5);
    
    particles.forEach(p => {
      catchCtx.fillStyle = `rgba(${hexToRgb(p.color)}, ${p.alpha})`;
      catchCtx.beginPath();
      catchCtx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      catchCtx.fill();
    });
  }
  
  function hexToRgb(hex) {
    const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
    return result ? 
      `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : 
      '255, 255, 255';
  }
  
  function update() {
    items.forEach((item, index) => {
      item.y += item.vy;
      item.rotation += 0.05;
      
      if (item.y + item.radius > basket.y &&
          item.y - item.radius < basket.y + basket.height &&
          item.x > basket.x &&
          item.x < basket.x + basket.width) {
        
        if (item.type === 'BOMB') {
          lives--;
          updateLives();
          createParticles(item.x, item.y, '#e74c3c', 20);
          
          if (lives <= 0) {
            gameOver();
          }
        } else {
          score += item.points;
          document.getElementById('score').textContent = score;
          createParticles(item.x, item.y, item.color, 10);
        }
        
        items.splice(index, 1);
      }
      
      if (item.y > catchCanvas.height + 20) {
        items.splice(index, 1);
      }
    });
    
    particles.forEach((p, index) => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.2;
      p.alpha -= 0.02;
      
      if (p.alpha <= 0) {
        particles.splice(index, 1);
      }
    });
    
    if (score > difficulty * 100) {
      difficulty = Math.min(difficulty + 0.5, 5);
    }
  }
  
  function gameStep() {
    if (!gameRunning) return;
    
    update();
    draw();
    requestAnimationFrame(gameStep);
  }
  
  function startGame() {
    initGame();
    gameRunning = true;
    document.getElementById('startBtn').disabled = true;
    
    spawnTimer = setInterval(() => {
      if (gameRunning) {
        spawnItem();
      }
    }, 1000 - difficulty * 100);
    
    gameStep();
  }
  
  function gameOver() {
    gameRunning = false;
    clearInterval(spawnTimer);
    
    document.getElementById('finalScore').textContent = score;
    document.getElementById('gameOver').classList.remove('hidden');
    document.getElementById('startBtn').disabled = false;
  }
  
  catchCanvas.addEventListener('mousemove', (e) => {
    if (!gameRunning) return;
    const rect = catchCanvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    basket.x = Math.max(0, Math.min(x - basket.width / 2, catchCanvas.width - basket.width));
  });
  
  catchCanvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (!gameRunning) return;
    const rect = catchCanvas.getBoundingClientRect();
    const x = e.touches[0].clientX - rect.left;
    basket.x = Math.max(0, Math.min(x - basket.width / 2, catchCanvas.width - basket.width));
  });
  
  initGame();
  draw();
</script>

</main>

</script>

</body>
