<style>

  color-scheme: dark;--bg:#0a0a0f;--card:#16162a;--t1:#f0f0f5;--t2:#8b8ba3;--accent:#6c5ce7;--border:rgba(255,255,255,.06)}
*{margin:0;padding:0;box-sizing:border-box}
  html{background:var(--bg)}
body{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t1);min-height:100vh}
.nav{position:sticky;top:0;z-index:100;backdrop-filter:blur(20px);background:rgba(10,10,15,.78);border-bottom:1px solid var(--border);padding:0 24px}
.nav-inner{max-width:900px;margin:0 auto;height:60px;display:flex;align-items:center;justify-content:space-between}
.nav-left{display:flex;align-items:center;gap:16px}
.logo{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-weight:700;font-size:1.15rem;text-decoration:none;color:#a29bfe}
.nav-back{color:var(--t2);text-decoration:none;font-size:.85rem;padding:6px 14px;border-radius:8px;border:1px solid var(--border);transition:.2s}
.nav-back:hover{color:var(--t1);background:rgba(255,255,255,.05)}

.main{max-width:800px;margin:0 auto;padding:36px 20px 60px;text-align:center}

/* 游戏容器样式覆盖 */
.game-container { max-width: 100%; margin: 0 auto; padding: 0; text-align: center; }
.game-header h1 { font-size: 2em; margin-bottom: 22px; font-weight: 700; }
.game-controls { margin: 18px 0; }
.game-controls button { padding: 10px 24px; margin: 0 8px; font-size: 15px; cursor: pointer; background: linear-gradient(135deg,#6c5ce7,#a29bfe); color: #fff; border: none; border-radius: 10px; font-weight: 600; transition: .25s; }
.game-controls button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(108,92,231,.4); }
.game-controls button:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
.game-controls select { padding: 10px 14px; font-size: 15px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--t1); outline: none; }

.game-info { display: flex; justify-content: center; gap: 20px; margin: 16px 0; font-size: 16px; color: var(--t2); flex-wrap: wrap; }
.game-info span { color: var(--accent); font-weight: 500; }
.game-board-container { position: relative; display: inline-block; margin: 18px 0; }

#gameCanvas, #nextCanvas { border: 2px solid rgba(108,92,231,.3); border-radius: 12px; display: block; }

.game-over, .game-win {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  background: rgba(10,10,15,.95); color: #fff; padding: 34px 44px;
  border-radius: 16px; text-align: center; border: 1px solid var(--border);
  backdrop-filter: blur(12px); z-index: 10;
}
.game-over.hidden, .game-win.hidden { display: none !important; }
.game-over h2, .game-win h2 { font-size: 1.6em; margin-bottom: 14px; color: #e74c3c; }
.game-over p, .game-win p { margin-bottom: 18px; color: var(--t2); font-size: 1.05em; }
.game-over button, .game-win button {
  padding: 11px 28px; font-size: 15px; cursor: pointer;
  background: linear-gradient(135deg,#6c5ce7,#a29bfe); color: #fff;
  border: none; border-radius: 10px; font-weight: 600;
}

.game-instructions {
  margin-top: 32px; text-align: left; padding: 22px 26px;
  background: var(--card); border-radius: 14px; border: 1px solid var(--border);
}
.game-instructions h3 { margin-bottom: 14px; color: var(--accent); font-size: 1.05em; }
.game-instructions ul { list-style: none; padding: 0; }
.game-instructions li { padding: 7px 0 7px 22px; position: relative; color: var(--t2); font-size: .9rem; line-height: 1.5; }
.game-instructions li::before { content: '▸'; position: absolute; left: 0; color: var(--accent); font-weight: bold; }

@media(max-width:640px){
  .nav-inner{height:52px;padding:0 16px}
  .main{padding:24px 16px 40px}
  #gameCanvas{max-width:100%;height:auto!important}
  .game-info{gap:12px;font-size:14px}
  .game-board-container{overflow-x:auto}
}
</style>

<main class="main">


<div class="game-container">
  <div class="game-header">
    <h1>🔢 数字华容道</h1>
    <div class="game-controls">
      <button onclick="newGame(3)">3×3</button>
      <button onclick="newGame(4)">4×4</button>
      <button onclick="newGame(5)">5×5</button>
    </div>
    <div class="game-info">
      <div class="moves">步数: <span id="moves">0</span></div>
      <div class="timer">时间: <span id="timer">0</span>s</div>
      <div class="best">最佳: <span id="bestScore">-</span></div>
    </div>
  </div>
  
  <div class="game-board-container">
    <div id="gameBoard" class="game-board"></div>
    <div id="gameWin" class="game-win hidden">
      <h2>🎉 恭喜过关!</h2>
      <p>用时: <span id="finalTime">0</span>秒</p>
      <p>步数: <span id="finalMoves">0</span>步</p>
      <button onclick="newGame(currentSize)">再来一局</button>
    </div>
  </div>
  
  <div class="game-instructions">
    <h3>游戏说明</h3>
    <ul>
      <li>点击数字方块移动到空位</li>
      <li>将数字按顺序排列（1, 2, 3...）</li>
      <li>空格在右下角为完成状态</li>
      <li>用最少步数和时间完成挑战</li>
    </ul>

<style>
  .game-container {
    max-width: 600px;
    margin: 0 auto;
    padding: 20px;
    text-align: center;
  }
  
  .game-header h1 {
    font-size: 2.5em;
    margin-bottom: 20px;
  }
  
  .game-controls {
    margin: 20px 0;
  }
  
  .game-controls button {
    padding: 10px 20px;
    margin: 0 5px;
    font-size: 16px;
    cursor: pointer;
    background: #6c5ce7;
    color: white;
    border: none;
    border-radius: 5px;
    transition: all 0.3s;
  }
  
  .game-controls button:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
  }
  
  .game-info {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin: 20px 0;
    font-size: 18px;
  }
  
  .game-board-container {
    position: relative;
    display: inline-block;
    margin: 20px 0;
  }
  
  .game-board {
    display: grid;
    gap: 5px;
    background: #333;
    padding: 10px;
    border-radius: 10px;
  }
  
  .tile {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
    font-weight: bold;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }
  
  .tile:hover {
    transform: scale(1.05);
    box-shadow: 0 4px 8px rgba(0,0,0,0.3);
  }
  
  .tile.empty {
    background: transparent;
    cursor: default;
  }
  
  .tile.empty:hover {
    transform: none;
    box-shadow: none;
  }
  
  .game-win {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.9);
    color: white;
    padding: 30px;
    border-radius: 10px;
    text-align: center;
  }
  
  .game-win.hidden {
    display: none;
  }
  
  .game-win button {
    margin-top: 15px;
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
    background: #6c5ce7;
    color: white;
    border: none;
    border-radius: 5px;
  }
  
  .game-instructions {
    margin-top: 30px;
    text-align: left;
    padding: 20px;
    background: #16162a;
    border-radius: 10px;
  }
  
  .game-instructions h3 {
    margin-bottom: 15px;
  }
  
  .game-instructions ul {
    list-style: none;
    padding: 0;
  }
  
  .game-instructions li {
    padding: 8px 0;
    padding-left: 20px;
    position: relative;
  }
  
  .game-instructions li:before {
    content: "•";
    position: absolute;
    left: 0;
    color: #6c5ce7;
  }
</style>

<script>
  let currentSize = 3;
  let tiles = [];
  let emptyPos = { x: 0, y: 0 };
  let moves = 0;
  let timer = 0;
  let timerInterval = null;
  let gameStarted = false;
  
  function getBestScore(size) {
    return localStorage.getItem(`puzzle${size}x${size}Best`);
  }
  
  function setBestScore(size, score) {
    localStorage.setItem(`puzzle${size}x${size}Best`, score);
  }
  
  function updateBestScore() {
    const best = getBestScore(currentSize);
    document.getElementById('bestScore').textContent = best || '-';
  }
  
  function initTiles(size) {
    tiles = [];
    for (let i = 0; i < size * size - 1; i++) {
      tiles.push(i + 1);
    }
    tiles.push(0); // 0 表示空格
  }
  
  function shuffleTiles() {
    // 随机打乱，但确保可解
    for (let i = tiles.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [tiles[i], tiles[j]] = [tiles[j], tiles[i]];
    }
    
    // 检查是否可解，如果不可解则交换两个非空方块
    if (!isSolvable()) {
      const first = tiles.findIndex(t => t !== 0);
      const second = tiles.findIndex((t, i) => t !== 0 && i > first);
      [tiles[first], tiles[second]] = [tiles[second], tiles[first]];
    }
  }
  
  function isSolvable() {
    let inversions = 0;
    const size = currentSize;
    
    for (let i = 0; i < tiles.length; i++) {
      for (let j = i + 1; j < tiles.length; j++) {
        if (tiles[i] && tiles[j] && tiles[i] > tiles[j]) {
          inversions++;
        }
      }
    }
    
    if (size % 2 === 1) {
      return inversions % 2 === 0;
    } else {
      const emptyRow = Math.floor(tiles.indexOf(0) / size);
      const emptyRowFromBottom = size - emptyRow;
      return (inversions + emptyRowFromBottom) % 2 === 1;
    }
  }
  
  function findEmpty() {
    const index = tiles.indexOf(0);
    return {
      x: index % currentSize,
      y: Math.floor(index / currentSize)
    };
  }
  
  function render() {
    const gameBoard = document.getElementById('gameBoard');
    gameBoard.innerHTML = '';
    
    const tileSize = currentSize === 3 ? 100 : currentSize === 4 ? 80 : 65;
    gameBoard.style.gridTemplateColumns = `repeat(${currentSize}, ${tileSize}px)`;
    gameBoard.style.gridTemplateRows = `repeat(${currentSize}, ${tileSize}px)`;
    
    for (let i = 0; i < tiles.length; i++) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.style.width = `${tileSize}px`;
      tile.style.height = `${tileSize}px`;
      
      if (tiles[i] === 0) {
        tile.classList.add('empty');
      } else {
        tile.textContent = tiles[i];
        tile.addEventListener('click', () => moveTile(i));
      }
      
      gameBoard.appendChild(tile);
    }
    
    document.getElementById('moves').textContent = moves;
  }
  
  function canMove(index) {
    const emptyIndex = tiles.indexOf(0);
    const size = currentSize;
    
    const emptyX = emptyIndex % size;
    const emptyY = Math.floor(emptyIndex / size);
    const tileX = index % size;
    const tileY = Math.floor(index / size);
    
    const dx = Math.abs(emptyX - tileX);
    const dy = Math.abs(emptyY - tileY);
    
    return (dx === 1 && dy === 0) || (dx === 0 && dy === 1);
  }
  
  function moveTile(index) {
    if (!canMove(index)) return;
    
    if (!gameStarted) {
      gameStarted = true;
      startTimer();
    }
    
    const emptyIndex = tiles.indexOf(0);
    [tiles[index], tiles[emptyIndex]] = [tiles[emptyIndex], tiles[index]];
    moves++;
    
    render();
    checkWin();
  }
  
  function startTimer() {
    timerInterval = setInterval(() => {
      timer++;
      document.getElementById('timer').textContent = timer;
    }, 1000);
  }
  
  function stopTimer() {
    if (timerInterval) {
      clearInterval(timerInterval);
      timerInterval = null;
    }
  }
  
  function checkWin() {
    for (let i = 0; i < tiles.length - 1; i++) {
      if (tiles[i] !== i + 1) {
        return;
      }
    }
    
    stopTimer();
    
    document.getElementById('finalTime').textContent = timer;
    document.getElementById('finalMoves').textContent = moves;
    
    const score = timer + moves;
    const best = getBestScore(currentSize);
    
    if (!best || score < parseInt(best)) {
      setBestScore(currentSize, score);
      updateBestScore();
    }
    
    document.getElementById('gameWin').classList.remove('hidden');
  }
  
  function newGame(size) {
    currentSize = size;
    moves = 0;
    timer = 0;
    gameStarted = false;
    
    stopTimer();
    updateBestScore();
    
    document.getElementById('timer').textContent = '0';
    document.getElementById('gameWin').classList.add('hidden');
    
    initTiles(size);
    shuffleTiles();
    render();
  }
  
  // 键盘控制
  document.addEventListener('keydown', (e) => {
    const emptyIndex = tiles.indexOf(0);
    const size = currentSize;
    const emptyX = emptyIndex % size;
    const emptyY = Math.floor(emptyIndex / size);
    
    let targetIndex = -1;
    
    switch (e.key) {
      case 'ArrowUp':
        if (emptyY < size - 1) {
          targetIndex = emptyIndex + size;
        }
        break;
      case 'ArrowDown':
        if (emptyY > 0) {
          targetIndex = emptyIndex - size;
        }
        break;
      case 'ArrowLeft':
        if (emptyX < size - 1) {
          targetIndex = emptyIndex + 1;
        }
        break;
      case 'ArrowRight':
        if (emptyX > 0) {
          targetIndex = emptyIndex - 1;
        }
        break;
    }
    
    if (targetIndex !== -1) {
      moveTile(targetIndex);
      e.preventDefault();
    }
  });
  
  // 初始化游戏
  newGame(3);
</script>

</main>
