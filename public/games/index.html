<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🎮 小游戏中心 | wr0ld's Blog</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0a0f;
      --bg2: #12121a;
      --card: #16162a;
      --card-h: #1e1e3a;
      --t1: #f0f0f5; --t2: #8b8ba3;
      --accent: #6c5ce7; --glow: rgba(108,92,231,.4);
      --cyan: #00cec9;
      --border: rgba(255,255,255,.06);
      --r: 20px;
    }
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{margin:0;padding:0;background:var(--bg);min-height:100vh}
    body{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:var(--t1)}

    /* 背景 */
    .bg{position:fixed;inset:0;z-index:-1;overflow:hidden}
    .orb{position:absolute;border-radius:50%;filter:blur(100px);opacity:.12;animation:f 25s ease-in-out infinite}
    .orb:nth-child(1){width:600px;height:600px;background:#6c5ce7;top:-10%;left:-10%}
    .orb:nth-child(2){width:500px;height:500px;background:#00cec9;bottom:-10%;right:-10%;animation-delay:-10s}
    .orb:nth-child(3){width:400px;height:400px;background:#fd79a8;top:40%;left:40%;animation-delay:-18s}
    @keyframes f{0%,100%{transform:translate(0,0)}33%{transform:translate(40px,-30px)}66%{transform:translate(-30px,40px)}}
    .grid-bg{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);background-size:60px 60px;mask:radial-gradient(ellipse at center,#000 30%,transparent 70%)}

    /* 导航 */
    .nav{position:sticky;top:0;z-index:100;backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);background:rgba(10,10,15,.78);border-bottom:1px solid var(--border)}
    .nav-inner{max-width:1400px;margin:0 auto;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 24px}
    .nav-left{display:flex;align-items:center;gap:16px}
    .logo{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-weight:700;font-size:1.25rem;text-decoration:none;background:linear-gradient(135deg,#6c5ce7,#a29bfe);-webkit-background-clip:text;-webkit-text-fill-color:transparent;letter-spacing:2px}
    .nav-home{color:var(--t2);text-decoration:none;font-size:.85rem;padding:6px 14px;border-radius:8px;border:1px solid var(--border);transition:.2s}
    .nav-home:hover{color:var(--t1);background:rgba(255,255,255,.05)}

    /* 搜索 */
    .search-wrap{position:relative;flex:0 1 300px}
    .search-input{width:100%;padding:9px 16px 9px 36px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:11px;color:var(--t1);font-size:.88rem;outline:none;transition:.25s;font-family:inherit}
    .search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
    .search-input::placeholder{color:var(--t2)}
    .search-icon{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--t2);font-size:.82rem;pointer-events:none}

    /* 主区 */
    .main{max-width:1400px;margin:0 auto;padding:44px 24px 72px}

    /* Hero */
    .hero{text-align:center;margin-bottom:48px;animation:up .6s ease both}
    @keyframes up{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}
    .badge{display:inline-flex;align-items:center;gap:7px;padding:5px 16px;background:rgba(108,92,231,.1);border:1px solid rgba(108,92,231,.2);border-radius:30px;font-size:.8rem;color:#a29bfe;margin-bottom:18px}
    .badge .dot{width:6px;height:6px;background:#6c5ce7;border-radius:50%;animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4;transform:scale(1.4)}}
    .hero h1{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:clamp(2rem,4.5vw,3.2rem);font-weight:900;line-height:1.15;margin-bottom:14px;letter-spacing:2px}
    .hero h1 .g-text{background:linear-gradient(135deg,#6c5ce7,#00cec9,#fd79a8);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-size:200% auto;-webkit-animation:gradient-shift 4s linear infinite}
    @keyframes gradient-shift{0%{background-position:0% center}100%{background-position:200% center}}
    .hero p{font-size:1rem;color:var(--t2);max-width:480px;margin:0 auto;line-height:1.6}

    .stats{display:flex;justify-content:center;gap:32px;margin-top:22px}
    .stat{text-align:center}
    .stat-num{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-size:1.6rem;font-weight:700;color:var(--cyan)}
    .stat-label{font-size:.75rem;color:var(--t2);margin-top:2px}

    /* 筛选 */
    .filters{display:flex;justify-content:center;gap:7px;margin-bottom:36px;flex-wrap:wrap;animation:up .6s ease .12s both}
    .filter-btn{padding:8px 20px;border-radius:30px;border:1px solid var(--border);background:0;color:var(--t2);cursor:pointer;font-size:.84rem;font-family:inherit;transition:.25s}
    .filter-btn:hover{border-color:rgba(108,92,231,.3);color:var(--t1);background:rgba(108,92,231,.06)}
    .filter-btn.active{background:linear-gradient(135deg,#6c5ce7,#a29bfe);border-color:0;color:#fff;font-weight:600;box-shadow:0 4px 15px var(--glow)}

    /* 网格 */
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;animation:up .6s ease .24s both}

    /* 卡片 */
    .card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:26px 22px;text-decoration:none;color:inherit;transition:.35s cubic-bezier(.25,.46,.45,.94);overflow:hidden;display:block}
    .card::after{content:'';position:absolute;top:0;left:22px;right:22px;height:3px;border-radius:0 0 4px 4px;opacity:0;transition:.3s}
    .card:hover{transform:translateY(-6px);border-color:rgba(108,92,231,.3);box-shadow:0 8px 32px rgba(0,0,0,.4),0 0 36px var(--glow);background:var(--card-h)}
    .card:hover::after{opacity:1}

    .icon-box{width:68px;height:68px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:2rem;margin-bottom:18px;transition:.35s cubic-bezier(.34,1.56,.64,1)}
    .card:hover .icon-box{transform:scale(1.1) rotate(-3deg)}

    .card-title{font-size:1.15rem;font-weight:700;margin-bottom:8px}
    .card-desc{font-size:.86rem;color:var(--t2);line-height:1.52;margin-bottom:16px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .tags{display:flex;gap:7px;flex-wrap:wrap}
    .tag{padding:4px 12px;border-radius:20px;font-size:.74rem;font-weight:500}

    /* 颜色变体 */
    .c-purple .icon-box{background:rgba(108,92,231,.13)}.c-purple::after{background:linear-gradient(90deg,#6c5ce7,#a29bfe)}.c-purple .tag{background:rgba(108,92,231,.14);color:#a29bfe}.c-purple:hover{border-color:rgba(108,92,231,.4)}
    .c-cyan .icon-box{background:rgba(0,206,201,.13)}.c-cyan::after{background:linear-gradient(90deg,#00cec9,#81ecec)}.c-cyan .tag{background:rgba(0,206,201,.14);color:#81ecec}.c-cyan:hover{border-color:rgba(0,206,201,.4)}
    .c-pink .icon-box{background:rgba(253,121,168,.13)}.c-pink::after{background:linear-gradient(90deg,#fd79a8,#f78fb0)}.c-pink .tag{background:rgba(253,121,168,.14);color:#f78fb0}.c-pink:hover{border-color:rgba(253,121,168,.4)}
    .c-orange .icon-box{background:rgba(253,203,110,.13)}.c-orange::after{background:linear-gradient(90deg,#fdcb6e,#f9ca24)}.c-orange .tag{background:rgba(253,203,110,.14);color:#fdcb6e}.c-orange:hover{border-color:rgba(253,203,110,.4)}
    .c-green .icon-box{background:rgba(0,184,148,.13)}.c-green::after{background:linear-gradient(90deg,#00b894,#55efc4)}.c-green .tag{background:rgba(0,184,148,.14);color:#55efc4}.c-green:hover{border-color:rgba(0,184,148,.4)}
    .c-red .icon-box{background:rgba(235,77,75,.13)}.c-red::after{background:linear-gradient(90deg,#eb4d4b,#ff7675)}.c-red .tag{background:rgba(235,77,75,.14);color:#ff7675}.c-red:hover{border-color:rgba(235,77,75,.4)}

    /* 隐藏 */
    .hidden{display:none!important}

    /* Footer */
    footer{text-align:center;padding:32px 24px;color:var(--t2);font-size:.82rem;border-top:1px solid var(--border);margin-top:48px}
    footer a{color:var(--accent);text-decoration:none}
    footer a:hover{text-decoration:underline}

    /* 响应式 */
    @media(max-width:640px){
      .nav-inner{height:56px;padding:0 16px}
      .logo{font-size:1.05rem}
      .search-wrap{display:none}
      .main{padding:28px 16px 48px}
      .grid{grid-template-columns:1fr;gap:14px}
      .stats{gap:20px}
      .stat-num{font-size:1.3rem}
      .hero h1{font-size:1.7rem}
    }
  </style>
</head>
<body>

<div class="bg">
  <div class="orb"></div><div class="orb"></div><div class="orb"></div>
  <div class="grid-bg"></div>
</div>

<nav class="nav">
  <div class="nav-inner">
    <div class="nav-left">
      <a href="/" class="logo">WR0LD</a>
      <a href="/" class="nav-home">&#x2190; 返回博客</a>
    </div>
    <div class="search-wrap">
      <span class="search-icon">&#x1F50D;</span>
      <input class="search-input" id="searchInput" placeholder="搜索游戏..." oninput="filterGames()">
    </div>
  </div>
</nav>

<main class="main">

<section class="hero">
  <div class="badge"><span class="dot"></span>GAME CENTER</div>
  <h1><span class="g-text">小游戏中心</span></h1>

  <div class="stats">
    <div class="stat"><div class="stat-num" id="totalGames">18</div><div class="stat-label">游戏总数</div></div>
    <div class="stat"><div class="stat-num">6</div><div class="stat-label">游戏类型</div></div>
    <div class="stat"><div class="stat-num">∞</div><div class="stat-label">快乐无限</div></div>
  </div>
</section>

<div class="filters" id="filters">
  <button class="filter-btn active" data-filter="all">全部</button>
  <button class="filter-btn" data-filter="经典">🎯 经典</button>
  <button class="filter-btn" data-filter="益智">💎 益智</button>
  <button class="filter-btn" data-filter="动作">⚡ 动作</button>
  <button class="filter-btn" data-filter="大型">☯️ 大型</button>
  <button class="filter-btn" data-filter="对战">⚔️ 对战</button>
  <button class="filter-btn" data-filter="3D">🎲 3D</button>
</div>

<div class="grid" id="gamesGrid"></div>

</main>

<footer>
  <p>&copy; 2024-2026 <a href="/">wr0ld</a> &middot; Powered by Hexo & Stellar Theme</p>
</footer>

<script>
const games = [
  {id:"snake",title:"贪吃蛇",icon:"🐍",desc:"经典贪吃蛇游戏，控制蛇吃食物，不要撞墙和自己！",tags:["经典","休闲"],cls:"c-purple"},
  {id:"tetris",title:"俄罗斯方块",icon:"🧱",desc:"经典俄罗斯方块，消除方块，挑战高分！",tags:["经典","益智"],cls:"c-cyan"},
  {id:"2048",title:"2048",icon:"🎯",desc:"数字合并游戏，挑战2048方块！",tags:["益智","数字"],cls:"c-orange"},
  {id:"breakout",title:"打砖块",icon:"🎱",desc:"经典打砖块游戏，用挡板反弹小球消除砖块！",tags:["经典","动作"],cls:"c-pink"},
  {id:"minesweeper",title:"扫雷",icon:"💣",desc:"经典扫雷游戏，找出所有地雷！",tags:["经典","策略"],cls:"c-red"},
  {id:"gobang",title:"五子棋",icon:"⚫",desc:"经典五子棋对战，AI难度可选，挑战最强AI！",tags:["经典","策略"],cls:"c-green"},
  {id:"memory",title:"记忆翻牌",icon:"🃏",desc:"翻开卡片找出配对，考验记忆力！",tags:["益智","记忆"],cls:"c-purple"},
  {id:"airplane",title:"飞机大战",icon:"✈️",desc:"经典射击游戏，击落敌机得分！",tags:["动作","射击"],cls:"c-cyan"},
  {id:"sokoban",title:"推箱子",icon:"📦",desc:"经典益智游戏，将箱子推到目标位置！",tags:["益智","策略"],cls:"c-orange"},
  {id:"puzzle",title:"数字华容道",icon:"🔢",desc:"滑块拼图游戏，将数字按顺序排列！",tags:["益智","拼图"],cls:"c-pink"},
  {id:"jump",title:"跳一跳",icon:"🦘",desc:"控制小人跳跃，精准落在平台上！",tags:["休闲","反应"],cls:"c-green"},
  {id:"match3",title:"消消乐",icon:"💎",desc:"三消游戏，交换宝石消除得分！",tags:["休闲","益智"],cls:"c-red"},
  {id:"whack",title:"打地鼠",icon:"🔨",desc:"快速敲打冒出的地鼠，考验反应速度！",tags:["休闲","反应"],cls:"c-purple"},
  {id:"catch",title:"接金币",icon:"🪙",desc:"控制角色接住掉落的金币，躲避炸弹！",tags:["休闲","反应"],cls:"c-cyan"},
  {id:"xiuxian",title:"修仙模拟器",icon:"☯️",desc:"大型修仙游戏，修炼、探索、炼丹、突破境界！",tags:["大型","RPG"],cls:"c-orange"},
  {id:"magictower",title:"魔塔",icon:"🗼",desc:"经典魔塔复刻，8层塔楼，策略数值战斗！",tags:["大型","经典"],cls:"c-pink"},
  {id:"rubiks",title:"3D魔方",icon:"🎲",desc:"3D魔方模拟器，支持旋转、打乱和重置！",tags:["3D","益智"],cls:"c-green"},
  {id:"snake-battle",title:"贪吃蛇大作战",icon:"⚔️",desc:"与AI对战，争夺食物和生存空间！",tags:["对战","竞技"],cls:"c-red"}
];

const grid = document.getElementById('gamesGrid');
const filters = document.querySelectorAll('.filter-btn');
let currentFilter = 'all';

function renderCards(filter, search) {
  filter = filter || 'all';
  search = (search || '').toLowerCase();
  grid.innerHTML = '';
  let count = 0;

  games.forEach(g => {
    const matchFilter = filter === 'all' || g.tags.includes(filter);
    const matchSearch = !search || g.title.toLowerCase().includes(search) || g.desc.toLowerCase().includes(search) || g.tags.some(t => t.includes(search));
    if (!matchFilter || !matchSearch) return;
    count++;

    const card = document.createElement('a');
    card.href = g.id + '/';
    card.className = `card ${g.cls}`;
    card.innerHTML = `
      <div class="icon-box">${g.icon}</div>
      <div class="card-title">${g.title}</div>
      <div class="card-desc">${g.desc}</div>
      <div class="tags">${g.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>`;
    grid.appendChild(card);
  });

  if (!count) {
    grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--t2)">😿 没有找到匹配的游戏</div>';
  }
}

// 筛选
filters.forEach(btn => {
  btn.addEventListener('click', () => {
    filters.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderCards(currentFilter, document.getElementById('searchInput').value);
  });
});

// 搜索
window.filterGames = function() {
  renderCards(currentFilter, document.getElementById('searchInput').value);
};

// 初始渲染
renderCards();

// 成就触发
(function triggerAchievement() {
  if (window.CardSystem && window.CardSystem.unlock) {
    window.CardSystem.unlock('explorer');
  } else {
    setTimeout(triggerAchievement, 800);
  }
})();
</script>

</body>
</html>
