<script>
(function () {
  var CARDS = [
    { n: 0, cn: '愚者', en: 'The Fool', up: '起点本身就是答案。行李很轻，路还很长，允许自己先出发再问为什么。', rev: '不是勇敢，是没看清。先补齐底线，再谈冒险。', keys: '开始 · 自由 · 天真' },
    { n: 1, cn: '魔术师', en: 'The Magician', up: '手上的资源已经够了，缺的是把它们连起来的那个动作。', rev: '话多过手。小心用技巧掩盖没想清楚的部分。', keys: '创造 · 表达 · 掌控' },
    { n: 2, cn: '女祭司', en: 'The High Priestess', up: '答案在没被说出口的那一层。安静一会儿比再查一遍更有用。', rev: '把直觉压成了偏见，或者故意不看某件事。', keys: '直觉 · 沉默 · 内里' },
    { n: 3, cn: '女皇', en: 'The Empress', up: '该让它长了。照看剩下的部分，比重新开一个更有价值。', rev: '过度照料变成了负担，或者只顾输出忘了补给。', keys: '生长 · 丰饶 · 照料' },
    { n: 4, cn: '皇帝', en: 'The Emperor', up: '把边界和规则先定下来，事情才开始有形状。', rev: '规则太多或者太硬，人已经被结构吃掉了。', keys: '秩序 · 边界 · 责任' },
    { n: 5, cn: '教皇', en: 'The Hierophant', up: '先按成法走一遍，理解之后再谈打破。', rev: '形式留下了，意义走了。该问一句「为什么还是这样」。', keys: '传统 · 教导 · 体系' },
    { n: 6, cn: '恋人', en: 'The Lovers', up: '这不是感情题，是价值题：选一边，另一边就会安静下来。', rev: '两边都不放，于是两边都不算数。', keys: '选择 · 契合 · 价值' },
    { n: 7, cn: '战车', en: 'The Chariot', up: '方向一旦定了，速度反而不用急；意志就是让它别偏的那只手。', rev: '被推着走，而不是自己在走。', keys: '推进 · 意志 · 方向' },
    { n: 8, cn: '力量', en: 'Strength', up: '真正的力量是让那头兽愿意待在你身边，不是把它关起来。', rev: '压住的东西会以别的形式回来。', keys: '勇气 · 耐心 · 驯服' },
    { n: 9, cn: '隐士', en: 'The Hermit', up: '一个人待着不是退场，是把杂音关掉，找回自己的判断。', rev: '独处变成了躲藏。门该开了。', keys: '独处 · 内省 · 提灯' },
    { n: 10, cn: '命运之轮', en: 'Wheel of Fortune', up: '轮子在转，此刻的位置不是终局。抓机会，但别把运气当能力。', rev: '同样的循环又走了一遍，说明某个条件没改。', keys: '流转 · 时机 · 循环' },
    { n: 11, cn: '正义', en: 'Justice', up: '把账算清楚，先算自己的那一份。', rev: '结论早就有了，只是缺一个理由。', keys: '公正 · 因果 · 衡量' },
    { n: 12, cn: '倒吊人', en: 'The Hanged Man', up: '停下来是主动的选择。换个角度看，卡住的地方可能就是入口。', rev: '停太久了，等待成了借口。', keys: '悬置 · 换位 · 甘愿' },
    { n: 13, cn: '死神', en: 'Death', up: '有些东西已经结束了，承认它，新的部分才有位置。', rev: '不肯放手，于是拖着一段已经死掉的东西。', keys: '结束 · 蜕变 · 清理' },
    { n: 14, cn: '节制', en: 'Temperance', up: '配比，而不是加码。把两极一点点调到一个能工作的中间。', rev: '极端之间的来回摇摆，正在消耗真正的力气。', keys: '调和 · 节奏 · 分寸' },
    { n: 15, cn: '恶魔', en: 'The Devil', up: '你被绑住的锁链是松的。承认那点沉溺，它就没那么有力。', rev: '开始看清那个习惯，绳子正在变松。', keys: '沉溺 · 束缚 · 欲望' },
    { n: 16, cn: '塔', en: 'The Tower', up: '塌掉的是本来就撑不住的部分。重建从承认这一点开始。', rev: '明知会塌还在加砖。小一点的崩落好过大的一次。', keys: '突变 · 崩塌 · 觉醒' },
    { n: 17, cn: '星星', en: 'The Star', up: '风暴之后的那点安静。不用急，先把水倒回池子里。', rev: '希望被耗光了，需要从很小的、能做成的事开始。', keys: '希望 · 疗愈 · 指引' },
    { n: 18, cn: '月亮', en: 'The Moon', up: '看到的不是全部。此阶段判断力打折，别据梦下结论。', rev: '雾在散。之前吓到你的东西有了解释。', keys: '幻象 · 潜意识 · 迷雾' },
    { n: 19, cn: '太阳', en: 'The Sun', up: '照单全收的时刻。把成果摆出来，别急着谦虚。', rev: '光被挡住了一点，但并没有熄灭。', keys: '明亮 · 成功 · 坦然' },
    { n: 20, cn: '审判', en: 'Judgement', up: '一次自我复核：过去的部分被重新调用，为了让你回应现在的召唤。', rev: '一味自责，听不见那个召唤。', keys: '召唤 · 复盘 · 重生' },
    { n: 21, cn: '世界', en: 'The World', up: '一个圈走完了。给它一个结尾，再决定要不要再来一圈。', rev: '差最后一步没走完，所以总觉得悬着。', keys: '完成 · 圆满 · 归位' }
  ];

  var KEY = 'tarot_history';
  var KEY_DAY = 'tarot_day';
  var deck = document.getElementById('tt-fan');
  var flip = document.getElementById('tt-flip');
  var img = document.getElementById('tt-img');
  var read = document.getElementById('tt-read');
  var histOl = document.getElementById('tt-hist');
  var countEl = document.getElementById('tt-count');
  var last = -1;
  var history = [];
  var today = '';

  function todayKey() {
    var d = new Date();
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  }
  function drawnToday() {
    for (var i = 0; i < history.length; i++) {
      if (history[i].k === today) return history[i];
    }
    return null;
  }

  function pad(n) { return (n < 10 ? '0' : '') + n }
  function src(n) { return '/tarot-data/' + pad(n + 1) + '.jpg' }

  function load() {
    try { history = JSON.parse(localStorage.getItem(KEY) || '[]') } catch (e) { history = [] }
    if (!Array.isArray(history)) history = [];
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(history.slice(-60))) } catch (e) {}
  }

  function syncDeck() {
    var todayRec = drawnToday();
    if (todayRec) {
      deck.classList.add('is-done');
      deck.setAttribute('aria-disabled', 'true');
      countEl.classList.add('is-done');
      countEl.textContent = '今天已经抽过 · 明天再来';
    } else {
      deck.classList.remove('is-done');
      deck.removeAttribute('aria-disabled');
      countEl.classList.remove('is-done');
      countEl.textContent = '已抽 ' + history.length + ' 次';
    }
    return todayRec;
  }

  function renderHistory() {
    syncDeck();
    if (!history.length) {
      histOl.innerHTML = '<li class="none">还没有记录，抽一张试试。</li>';
      return;
    }
    histOl.innerHTML = history.slice().reverse().map(function (h) {
      var c = CARDS[h.i];
      return '<li data-n="' + c.n + '"><span class="thumb" style="background-image:url(' + src(c.n) + ')"></span><p class="cap">' + c.cn + '<em>' + h.t + '</em></p></li>';
    }).join('');
    Array.prototype.forEach.call(histOl.querySelectorAll('li[data-n]'), function (li) {
      li.addEventListener('click', function () { show(+li.getAttribute('data-n'), false) });
    });
  }

  function render(card) {
    document.getElementById('tt-num').textContent = pad(card.n) + ' / 22';
    document.getElementById('tt-name').textContent = card.cn;
    document.getElementById('tt-en').textContent = card.en;
    document.getElementById('tt-meaning').textContent = card.up;
    document.getElementById('tt-rev-meaning').textContent = card.rev;
    document.getElementById('tt-keys').textContent = card.keys;
    img.src = src(card.n);
    img.alt = card.cn + '（' + card.en + '）';
  }

  function pick() {
    var i = Math.floor(Math.random() * CARDS.length);
    if (i === last) { i = (i + 1 + Math.floor(Math.random() * (CARDS.length - 1))) % CARDS.length }
    return i;
  }

  function stamp() {
    var d = new Date();
    return pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  function show(n, record) {
    last = n;
    read.classList.remove('is-empty');
    // 先无动画地复位到背面，再触发翻转，保证每次抽牌动画时长一致
    flip.style.transition = 'none';
    flip.classList.remove('open');
    void flip.offsetWidth;
    render(CARDS[n]);
    flip.style.transition = '';
    setTimeout(function () { flip.classList.add('open') }, 20);
    if (record !== false) {
      history.push({ i: n, t: stamp(), k: today });
      save();
      renderHistory();
    }
  }

  deck.addEventListener('click', function () {
    if (drawnToday()) return;
    show(pick(), true);
  });

  load();
  today = todayKey();
  renderHistory();
  var todayRec = drawnToday();
  if (todayRec) show(todayRec.i, false);
})();
</script>
