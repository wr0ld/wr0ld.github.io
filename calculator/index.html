<script>
var currentInput = '0';
var previousInput = '';
var operator = null;
var shouldResetInput = false;
var history = '';

function updateDisplay() {
  document.getElementById('calcResult').textContent = formatNumber(currentInput);
  document.getElementById('calcExpression').textContent = previousInput + (operator ? ' ' + getOperatorSymbol(operator) : '');
  document.getElementById('calcHistory').textContent = history;
}

function formatNumber(num) {
  if (num === 'Error') return num;
  var n = parseFloat(num);
  if (isNaN(n)) return '0';
  if (Math.abs(n) >= 1e15 || (Math.abs(n) < 1e-10 && n !== 0)) {
    return n.toExponential(6);
  }
  return n.toLocaleString('en-US', { maximumFractionDigits: 10 });
}

function getOperatorSymbol(op) {
  switch(op) {
    case '+': return '+';
    case '-': return '−';
    case '*': return '×';
    case '/': return '÷';
    default: return op;
  }
}

function inputNumber(num) {
  if (shouldResetInput) {
    currentInput = num;
    shouldResetInput = false;
  } else {
    if (currentInput === '0' && num !== '.') {
      currentInput = num;
    } else {
      currentInput += num;
    }
  }
  updateDisplay();
}

function inputDecimal() {
  if (shouldResetInput) {
    currentInput = '0.';
    shouldResetInput = false;
  } else if (!currentInput.includes('.')) {
    currentInput += '.';
  }
  updateDisplay();
}

function inputOperator(op) {
  if (operator && !shouldResetInput) {
    calculate();
  }
  previousInput = currentInput;
  operator = op;
  shouldResetInput = true;
  updateDisplay();
  
  document.querySelectorAll('.calc-btn.operator').forEach(function(btn) {
    btn.classList.remove('active');
  });
  event.target.classList.add('active');
}

function calculate() {
  if (!operator || previousInput === '') return;
  
  var prev = parseFloat(previousInput);
  var curr = parseFloat(currentInput);
  var result;
  
  switch(operator) {
    case '+':
      result = prev + curr;
      break;
    case '-':
      result = prev - curr;
      break;
    case '*':
      result = prev * curr;
      break;
    case '/':
      if (curr === 0) {
        result = 'Error';
      } else {
        result = prev / curr;
      }
      break;
  }
  
  history = previousInput + ' ' + getOperatorSymbol(operator) + ' ' + currentInput + ' = ' + formatNumber(result);
  currentInput = result.toString();
  previousInput = '';
  operator = null;
  shouldResetInput = true;
  
  document.querySelectorAll('.calc-btn.operator').forEach(function(btn) {
    btn.classList.remove('active');
  });
  
  updateDisplay();
}

function clearAll() {
  currentInput = '0';
  previousInput = '';
  operator = null;
  shouldResetInput = false;
  history = '';
  document.querySelectorAll('.calc-btn.operator').forEach(function(btn) {
    btn.classList.remove('active');
  });
  updateDisplay();
}

function clearEntry() {
  currentInput = '0';
  shouldResetInput = false;
  updateDisplay();
}

function backspace() {
  if (currentInput.length > 1) {
    currentInput = currentInput.slice(0, -1);
  } else {
    currentInput = '0';
  }
  updateDisplay();
}

function toggleSign() {
  if (currentInput !== '0') {
    if (currentInput.startsWith('-')) {
      currentInput = currentInput.slice(1);
    } else {
      currentInput = '-' + currentInput;
    }
  }
  updateDisplay();
}

function inputPercent() {
  currentInput = (parseFloat(currentInput) / 100).toString();
  updateDisplay();
}

function square() {
  var num = parseFloat(currentInput);
  history = currentInput + '² = ' + formatNumber(num * num);
  currentInput = (num * num).toString();
  shouldResetInput = true;
  updateDisplay();
}

function sqrt() {
  var num = parseFloat(currentInput);
  if (num < 0) {
    currentInput = 'Error';
  } else {
    history = '√' + currentInput + ' = ' + formatNumber(Math.sqrt(num));
    currentInput = Math.sqrt(num).toString();
  }
  shouldResetInput = true;
  updateDisplay();
}

function inputFunction(func) {
  var num = parseFloat(currentInput);
  var result = 1 / num;
  history = '1/(' + currentInput + ') = ' + formatNumber(result);
  currentInput = result.toString();
  shouldResetInput = true;
  updateDisplay();
}

function minimizeCalc() {
  document.querySelector('.calc-window').classList.add('minimized');
}

function maximizeCalc() {
  document.querySelector('.calc-window').classList.toggle('maximized');
}

function closeCalc() {
  document.querySelector('.calculator-container').style.display = 'none';
}

document.addEventListener('keydown', function(e) {
  if (e.key >= '0' && e.key <= '9') {
    inputNumber(e.key);
  } else if (e.key === '.') {
    inputDecimal();
  } else if (e.key === '+') {
    inputOperator('+');
  } else if (e.key === '-') {
    inputOperator('-');
  } else if (e.key === '*') {
    inputOperator('*');
  } else if (e.key === '/') {
    e.preventDefault();
    inputOperator('/');
  } else if (e.key === 'Enter' || e.key === '=') {
    calculate();
  } else if (e.key === 'Escape') {
    clearAll();
  } else if (e.key === 'Backspace') {
    backspace();
  }
});

updateDisplay();
</script>
