<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧱 俄罗斯方块 | wr0ld's Blog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Orbitron:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0f;--card:#16162a;--t1:#f0f0f5;--t2:#8b8ba3;--accent:#6c5ce7;--border:rgba(255,255,255,.06)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--t1)}
.nav{position:sticky;top:0;z-index:100;backdrop-filter:blur(20px);background:rgba(10,10,15,.78);border-bottom:1px solid var(--border);padding:0 24px}
.nav-inner{max-width:900px;margin:0 auto;height:60px;display:flex;align-items:center;justify-content:space-between}
.nav-left{display:flex;align-items:center;gap:16px}
.logo{font-family:'Orbitron',sans-serif;font-weight:700;font-size:1.15rem;text-decoration:none;color:#a29bfe}
.nav-back{color:var(--t2);text-decoration:none;font-size:.85rem;padding:6px 14px;border-radius:8px;border:1px solid var(--border);transition:.2s}.nav-back:hover{color:var(--t1);background:rgba(255,255,255,.05)}
.main{max-width:800px;margin:0 auto;padding:36px 20px 60px;text-align:center}
.game-header h1{font-size:2em;margin-bottom:22px}
.game-controls{margin:18px 0}
.game-controls button{padding:10px 24px;margin:0 8px;font-size:15px;cursor:pointer;background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff;border:none;border-radius:10px;font-weight:600;transition:.25s}
.game-controls button:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(108,92,231,.4)}.game-controls button:disabled{opacity:.45}
.game-info{display:flex;justify-content:center;gap:20px;margin:16px 0;font-size:16px;color:var(--t2)} .game-info span{color:var(--accent)}
.game-board-container{position:relative;display:inline-flex;gap:16px;margin:18px 0;align-items:flex-start}
.game-sidebar{display:flex;flex-direction:column;gap:14px}
.next-piece{background:var(--card);padding:14px;border-radius:12px;border:1px solid var(--border)}
.next-piece h3{margin-bottom:10px;font-size:.88rem;color:var(--t2)}
#gameCanvas{border:2px solid rgba(108,92,231,.3);border-radius:12px;display:block}#nextCanvas{display:block}
.game-over{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(10,10,15,.95);color:#fff;padding:34px 44px;border-radius:16px;text-align:center;border:1px solid var(--border);z-index:10}.game-over.hidden{display:none}
.game-over h2{font-size:1.6em;margin-bottom:14px;color:#e74c3c}.game-over p{margin-bottom:18px;color:var(--t2)}
.game-over button{padding:11px 28px;cursor:pointer;background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff;border:none;border-radius:10px;font-weight:600}
.game-instructions{margin-top:32px;text-align:left;padding:22px 26px;background:var(--card);border-radius:14px;border:1px solid var(--border)}
.game-instructions h3{margin-bottom:14px;color:var(--accent)}
.game-instructions ul{list-style:none;padding:0}.game-instructions li{padding:8px 0 8px 22px;position:relative;color:var(--t2);font-size:.9rem}.game-instructions li::before{content:'▸';position:absolute;left:0;color:var(--accent)}
@media(max-width:640px){.nav-inner{height:52px;padding:0 16px}.main{padding:24px 16px 40px}.game-board-container{flex-direction:column;align-items:center}#gameCanvas{max-width:100%}}
</style>
</head>
<body>
<nav class="nav"><div class="nav-inner"><div class="nav-left"><a href="/games/" class="logo">🎮 GAME</a><a href="/games/" class="nav-back">← 返回</a></div></div></nav>
<main class="main">
<div class="game-container">
  <div class="game-header"><h1>🧱 俄罗斯方块</h1></div>
  <div class="game-controls"><button id="startBtn" onclick="startGame()">开始游戏</button><button id="pauseBtn" onclick="togglePause()" disabled>暂停</button></div>
  <div class="game-info"><div>得分: <span id="score">0</span></div><div>最高分: <span id="highScore">0</span></div><div>等级: <span id="level">1</span></div><div>消行: <span id="lines">0</span></div></div>
  <div class="game-board-container">
    <div class="game-sidebar"><div class="next-piece"><h3>下一个</h3><canvas id="nextCanvas" width="120" height="120"></canvas></div></div>
    <canvas id="gameCanvas" width="300" height="600"></canvas>
    <div id="gameOver" class="game-over hidden"><h2>游戏结束!</h2><p>得分: <span id="finalScore">0</span></p><button onclick="restartGame()">重新开始</button></div>
  </div>
  <div class="game-instructions"><h3>游戏说明</h3><ul><li>←/A 左移 | →/D 右移 | ↑/W 旋转 | ↓/S 加速</li><li>空格键直接落到底部</li><li>填满一行即可消除得分升级</li></ul></div>
</div>
</main>
<script>
const C=document.getElementById('gameCanvas'),x=C.getContext('2d');
const NC=document.getElementById('nextCanvas'),nx=NC.getContext('2d');
const COLS=10,ROWS=20,BZ=30;
const COLORS=['#000','#00f','#ff7f00','#ff0','#0f0','#800080','#f00'];
const SHAPES=[[],[[1,1,1,1]],[[2,0,0],[2,2,2]],[[0,0,3],[3,3,3]],[[4,4],[4,4]],[[0,5,5],[5,5,0]],[[0,6,0],[6,6,6]],[[7,7,0],[0,7,7]]];
let board=[],cp,np,score=0,hs=localStorage.getItem('tetrisHighScore')||0,lv=1,ln=0,gl=null,pause=false,interval=1000,lastDrop=0;
document.getElementById('highScore').textContent=hs;
function initBoard(){board=[];for(let r=0;r<ROWS;r++){board[r]=[];for(let c=0;c<COLS;c++)board[r][c]=0;}}
function mkPiece(t){let s=SHAPES[t];return{type:t,shape:s,x:Math.floor(COLS/2)-Math.floor(s[0].length/2),y:0};}
function rndPiece(){return mkPiece(Math.floor(Math.random()*7)+1);}
function rot(p){let ns=[];for(let c=0;c<p.shape[0].length;c++){ns[c]=[];for(let r=p.shape.length-1;r>=0;r--)ns[c][p.shape.length-1-r]=p.shape[r][c];}return ns;}
function coll(p,oX=0,oY=0,nS=null){let s=nS||p.shape;for(let r=0;r<s.length;r++)for(let c=0;c<s[r].length;c++)if(s[r][c]){let nx=p.x+c+oX,ny=p.y+r+oY;if(nx<0||nx>=COLS||ny>=ROWS||(ny>=0&&board[ny][nx]))return true;}return false;}
function merge(p){for(let r=0;r<p.shape.length;r++)for(let c=0;c<p.shape[r].length;c++)if(p.shape[r][c]){if(p.y+r<0)return false;board[p.y+r][p.x+c]=p.type;}return true;}
function clearLines(){let lc=0;for(let r=ROWS-1;r>=0;r--){let f=true;for(let c=0;c<COLS;c++)if(!board[r][c])f=false;if(f){board.splice(r,1);board.unshift(new Array(COLS).fill(0));lc++;r++;}}if(lc>0){let pts=[0,100,300,500,800];score+=pts[lc]*lv;ln+=lc;lv=Math.floor(ln/10)+1;interval=Math.max(100,1000-(lv-1)*100);if(score>hs){hs=score;document.getElementById('highScore').textContent=hs;localStorage.setItem('tetrisHighScore',hs);}document.getElementById('score').textContent=score;document.getElementById('level').textContent=lv;document.getElementById('lines').textContent=ln;}}
function dB(ctx,x,y,t){if(t){ctx.fillStyle=COLORS[t];ctx.fillRect(x*BZ,y*BZ,BZ,BZ);ctx.strokeStyle='#222';ctx.strokeRect(x*BZ,y*BZ,BZ,BZ);}}
function draw(){x.fillStyle='#000';x.fillRect(0,0,C.width,C.height);x.strokeStyle='#222';for(let r=0;r<=ROWS;r++){x.beginPath();x.moveTo(0,r*BZ);x.lineTo(C.width,r*BZ);x.stroke();}for(let c=0;c<=COLS;c++){x.beginPath();x.moveTo(c*BZ,0);x.lineTo(c*BZ,C.height);x.stroke();}for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)dB(x,c,r,board[r][c]);if(cp)for(let r=0;r<cp.shape.length;r++)for(let c=0;c<cp.shape[r].length;c++)if(cp.shape[r][c])dB(x,cp.x+c,cp.y+r,cp.type);
  nx.fillStyle='#000';nx.fillRect(0,0,NC.width,NC.height);if(np){let ox=(4-np.shape[0].length)/2,oy=(4-np.shape.length)/2;
  for(let r=0;r<np.shape.length;r++)for(let c=0;c<np.shape[r].length;c++)if(np.shape[r][c]){nx.fillStyle=COLORS[np.type];nx.fillRect((ox+c)*BZ,(oy+r)*BZ,BZ,BZ);nx.strokeStyle='#222';nx.strokeRect((ox+c)*BZ,(oy+r)*BZ,BZ,BZ);}}}
function drop(){if(!coll(cp,0,1))cp.y++;else{if(!merge(cp)){gOver();return;}clearLines();cp=np;np=rndPiece();if(coll(cp)){gOver();return;}}}
function step(ts){if(!pause&&(ts-lastDrop>interval)){drop();lastDrop=ts;}draw();gl=requestAnimationFrame(step);}
function startGame(){initBoard();score=0;lv=1;ln=0;interval=1000;lastDrop=0;pause=false;document.getElementById('score').textContent=score;document.getElementById('level').textContent=lv;document.getElementById('lines').textContent=ln;cp=rndPiece();np=rndPiece();document.getElementById('startBtn').disabled=true;document.getElementById('pauseBtn').disabled=false;document.getElementById('pauseBtn').textContent='暂停';document.getElementById('gameOver').classList.add('hidden');if(gl)cancelAnimationFrame(gl);draw();gl=requestAnimationFrame(step);}
function togglePause(){pause=!pause;document.getElementById('pauseBtn').textContent=pause?'继续':'暂停';}
function gOver(){cancelAnimationFrame(gl);gl=null;pause=false;document.getElementById('finalScore').textContent=score;document.getElementById('gameOver').classList.remove('hidden');document.getElementById('startBtn').disabled=false;document.getElementById('pauseBtn').disabled=true;}
document.addEventListener('keydown',e=>{if(e.key==='p'||e.key==='P'){e.preventDefault();if(gl)togglePause();return;}if(pause||!cp)return;
switch(e.key){case'ArrowLeft':case'a':case'A':if(!coll(cp,-1,0))cp.x--;break;case'ArrowRight':case'd':case'D':if(!coll(cp,1,0))cp.x++;break;case'ArrowDown':case's':case'S':drop();break;case'ArrowUp':case'w':case'W':let ro=rot(cp);if(!coll(cp,0,0,ro))cp.shape=ro;break;case' ':e.preventDefault();while(!coll(cp,0,1))cp.y++;drop();break;}});
initBoard();draw();
setTimeout(function(){if(window.CardSystem)CardSystem.unlock('gamer');else setTimeout(arguments.callee,500);},500);
</script>
</body>
</html>
