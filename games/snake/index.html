<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐍 贪吃蛇 | wr0ld's Blog</title>


<style>
:root {
  color-scheme: dark;--bg:#0a0a0f;--bg2:#12121a;--card:#16162a;--t1:#f0f0f5;--t2:#8b8ba3;--accent:#6c5ce7;--border:rgba(255,255,255,.06)}
*{margin:0;padding:0;box-sizing:border-box}
  html{background:var(--bg)}
body{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t1);min-height:100vh}
.nav{position:sticky;top:0;z-index:100;backdrop-filter:blur(20px);background:rgba(10,10,15,.78);border-bottom:1px solid var(--border);padding:0 24px}
.nav-inner{max-width:900px;margin:0 auto;height:60px;display:flex;align-items:center;justify-content:space-between}
.nav-left{display:flex;align-items:center;gap:16px}
.logo{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-weight:700;font-size:1.15rem;text-decoration:none;color:#a29bfe}
.nav-back{color:var(--t2);text-decoration:none;font-size:.85rem;padding:6px 14px;border-radius:8px;border:1px solid var(--border);transition:.2s}
.nav-back:hover{color:var(--t1);background:rgba(255,255,255,.05)}

.main{max-width:700px;margin:0 auto;padding:36px 20px 60px;text-align:center}
.game-header h1{font-size:2em;margin-bottom:22px;font-weight:700}
.game-controls{margin:18px 0}
.game-controls button{padding:10px 24px;margin:0 8px;font-size:15px;cursor:pointer;background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff;border:none;border-radius:10px;font-weight:600;transition:.25s}
.game-controls button:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(108,92,231,.4)}
.game-controls button:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.game-info{display:flex;justify-content:center;gap:28px;margin:18px 0;font-size:17px;font-weight:500;color:var(--t2)}
.game-info span{color:var(--accent)}
.game-board-container{position:relative;display:inline-block;margin:18px 0}
#gameCanvas{border:3px solid rgba(108,92,231,.3);border-radius:12px;background:#0d1117;display:block}
.game-over{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(10,10,15,.95);color:#fff;padding:34px 44px;border-radius:16px;text-align:center;border:1px solid var(--border);backdrop-filter:blur(12px)}
.game-over.hidden{display:none}
.game-over h2{font-size:1.6em;margin-bottom:14px;color:#e74c3c}
.game-over p{margin-bottom:18px;font-size:1.1em;color:var(--t2)}
.game-over button{padding:11px 28px;font-size:15px;cursor:pointer;background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff;border:none;border-radius:10px;font-weight:600;transition:.25s}
.game-over button:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(108,92,231,.4)}
.game-instructions{margin-top:32px;text-align:left;padding:22px 26px;background:var(--card);border-radius:14px;border:1px solid var(--border)}
.game-instructions h3{margin-bottom:14px;font-size:1.05em;color:var(--accent)}
.game-instructions ul{list-style:none;padding:0}
.game-instructions li{padding:8px 0 8px 22px;position:relative;color:var(--t2);font-size:.9rem;line-height:1.5}
.game-instructions li::before{content:'▸';position:absolute;left:0;color:var(--accent);font-weight:bold}

@media(max-width:640px){
  .nav-inner{height:52px;padding:0 16px}
  .main{padding:24px 16px 40px}
  #gameCanvas{max-width:100%;height:auto}
  .game-info{gap:16px;font-size:15px;flex-wrap:wrap}
}
</style>
</head>
<body>

<nav class="nav"><div class="nav-inner">
<div class="nav-left"><a href="/games/" class="logo">🎮 GAME</a><a href="/games/" class="nav-back">← 返回</a></div>
</div></nav>

<main class="main">

<div class="game-container">
  <div class="game-header"><h1>🐍 贪吃蛇</h1></div>
  <div class="game-controls">
    <button id="startBtn" onclick="startGame()">开始游戏</button>
    <button id="pauseBtn" onclick="togglePause()" disabled>暂停</button>
  </div>
  <div class="game-info">
    <div>得分: <span id="score">0</span></div>
    <div>最高分: <span id="highScore">0</span></div>
  </div>

  <div class="game-board-container">
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div id="gameOver" class="game-over hidden">
      <h2>游戏结束!</h2><p>得分: <span id="finalScore">0</span></p>
      <button onclick="restartGame()">重新开始</button>
    </div>
  </div>

  <div class="game-instructions">
    <h3>游戏说明</h3>
    <ul>
      <li>使用方向键或 WASD 控制蛇的移动方向</li>
      <li>吃到食物得分，蛇身会变长</li>
      <li>撞到墙壁或自己的身体游戏结束</li>
      <li>按空格键暂停/继续游戏</li>
    </ul>
  </div>
</div>

</main>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const gridSize = 20;
const tileCount = canvas.width / gridSize;

let snake=[],food={},direction={x:1,y:0},nextDirection={x:1,y:0},score=0;
let highScore=localStorage.getItem('snakeHighScore')||0,gameLoop=null,isPaused=false,gameSpeed=100;
document.getElementById('highScore').textContent=highScore;

function initGame(){
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  direction={x:1,y:0};nextDirection={x:1,y:0};score=0;gameSpeed=100;
  document.getElementById('score').textContent=score;generateFood();
}
function generateFood(){
  food={x:Math.floor(Math.random()*tileCount),y:Math.floor(Math.random()*tileCount)};
  for(let s of snake)if(s.x===food.x&&s.y===food.y){generateFood();return;}
}
function draw(){
  ctx.fillStyle='#0d1117';ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.strokeStyle='rgba(108,92,231,.15)';ctx.lineWidth=.5;
  for(let i=0;i<=tileCount;i++){ctx.beginPath();ctx.moveTo(i*gridSize,0);ctx.lineTo(i*gridSize,canvas.height);ctx.stroke();ctx.beginPath();ctx.moveTo(0,i*gridSize);ctx.lineTo(canvas.width,i*gridSize);ctx.stroke();}
  snake.forEach((seg,i)=>{ctx.fillStyle=i===0?'#6c5ce7':'#a29bfe';ctx.fillRect(seg.x*gridSize+1,seg.y*gridSize+1,gridSize-2,gridSize-2);});
  ctx.fillStyle='#e74c3c';ctx.beginPath();ctx.arc(food.x*gridSize+gridSize/2,food.y*gridSize+gridSize/2,gridSize/2-2,0,Math.PI*2);ctx.fill();
}
function update(){
  direction={...nextDirection};
  const head={x:snake[0].x+direction.x,y:snake[0].y+direction.y};
  if(head.x<0||head.x>=tileCount||head.y<0||head.y>=tileCount){gameOver();return;}
  for(let s of snake){if(head.x===s.x&&head.y===s.y){gameOver();return;}}
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    score+=10;document.getElementById('score').textContent=score;
    if(score>highScore){highScore=score;document.getElementById('highScore').textContent=highScore;localStorage.setItem('snakeHighScore',highScore);}
    generateFood();
    if(gameSpeed>50){gameSpeed-=2;clearInterval(gameLoop);gameLoop=setInterval(gameStep,gameSpeed);}
  }else{snake.pop();}
}
function gameStep(){if(!isPaused){update();draw();}}
function startGame(){initGame();isPaused=false;document.getElementById('startBtn').disabled=true;document.getElementById('pauseBtn').disabled=false;document.getElementById('pauseBtn').textContent='暂停';document.getElementById('gameOver').classList.add('hidden');if(gameLoop)clearInterval(gameLoop);draw();gameLoop=setInterval(gameStep,gameSpeed);}
function togglePause(){isPaused=!isPaused;document.getElementById('pauseBtn').textContent=isPaused?'继续':'暂停';}
function gameOver(){clearInterval(gameLoop);gameLoop=null;isPaused=false;document.getElementById('finalScore').textContent=score;document.getElementById('gameOver').classList.remove('hidden');document.getElementById('startBtn').disabled=false;document.getElementById('pauseBtn').disabled=true;}
function restartGame(){startGame();}
document.addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();if(gameLoop)togglePause();return;}
  if(isPaused)return;
  switch(e.key){
    case'ArrowUp':case'w':case'W':if(direction.y!==1)nextDirection={x:0,y:-1};break;
    case'ArrowDown':case's':case'S':if(direction.y!==-1)nextDirection={x:0,y:1};break;
    case'ArrowLeft':case'a':case'A':if(direction.x!==1)nextDirection={x:-1,y:0};break;
    case'ArrowRight':case'd':case'D':if(direction.x!==-1)nextDirection={x:1,y:0};break;
  }
});
initGame();draw();

// 成就
setTimeout(function(){if(window.CardSystem)CardSystem.unlock('gamer');else setTimeout(arguments.callee,500);},500);
</script>

</body>
</html>
