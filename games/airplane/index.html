<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>飞 飞机大战 | wr0ld's Blog</title>
<style>
:root {
  color-scheme: dark;--bg:#0a0a0f;--card:#16162a;--t1:#f0f0f5;--t2:#8b8ba3;--accent:#6c5ce7;--border:rgba(255,255,255,.06)}
*{margin:0;padding:0;box-sizing:border-box}
  html{background:var(--bg)}
body{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t1);min-height:100vh}
.nav{position:sticky;top:0;z-index:100;backdrop-filter:blur(20px);background:rgba(10,10,15,.78);border-bottom:1px solid var(--border);padding:0 24px}
.nav-inner{max-width:900px;margin:0 auto;height:60px;display:flex;align-items:center;justify-content:space-between}
.nav-left{display:flex;align-items:center;gap:16px}
.logo{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-weight:700;font-size:1.15rem;text-decoration:none;color:#a29bfe}
.nav-back{color:var(--t2);text-decoration:none;font-size:.85rem;padding:6px 14px;border-radius:8px;border:1px solid var(--border);transition:.2s}
.nav-back:hover{color:var(--t1);background:rgba(255,255,255,.05)}

.main{max-width:800px;margin:0 auto;padding:36px 20px 60px;text-align:center}

/* 游戏容器样式覆盖 */
.game-container { max-width: 100%; margin: 0 auto; padding: 0; text-align: center; }
.game-header h1 { font-size: 2em; margin-bottom: 22px; font-weight: 700; }
.game-controls { margin: 18px 0; }
.game-controls button { padding: 10px 24px; margin: 0 8px; font-size: 15px; cursor: pointer; background: linear-gradient(135deg,#6c5ce7,#a29bfe); color: #fff; border: none; border-radius: 10px; font-weight: 600; transition: .25s; }
.game-controls button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(108,92,231,.4); }
.game-controls button:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
.game-controls select { padding: 10px 14px; font-size: 15px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--t1); outline: none; }

.game-info { display: flex; justify-content: center; gap: 20px; margin: 16px 0; font-size: 16px; color: var(--t2); flex-wrap: wrap; }
.game-info span { color: var(--accent); font-weight: 500; }
.game-board-container { position: relative; display: inline-block; margin: 18px 0; }

#gameCanvas, #nextCanvas { border: 2px solid rgba(108,92,231,.3); border-radius: 12px; display: block; }

.game-over, .game-win {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  background: rgba(10,10,15,.95); color: #fff; padding: 34px 44px;
  border-radius: 16px; text-align: center; border: 1px solid var(--border);
  backdrop-filter: blur(12px); z-index: 10;
}
.game-over.hidden, .game-win.hidden { display: none !important; }
.game-over h2, .game-win h2 { font-size: 1.6em; margin-bottom: 14px; color: #e74c3c; }
.game-over p, .game-win p { margin-bottom: 18px; color: var(--t2); font-size: 1.05em; }
.game-over button, .game-win button {
  padding: 11px 28px; font-size: 15px; cursor: pointer;
  background: linear-gradient(135deg,#6c5ce7,#a29bfe); color: #fff;
  border: none; border-radius: 10px; font-weight: 600;
}

.game-instructions {
  margin-top: 32px; text-align: left; padding: 22px 26px;
  background: var(--card); border-radius: 14px; border: 1px solid var(--border);
}
.game-instructions h3 { margin-bottom: 14px; color: var(--accent); font-size: 1.05em; }
.game-instructions ul { list-style: none; padding: 0; }
.game-instructions li { padding: 7px 0 7px 22px; position: relative; color: var(--t2); font-size: .9rem; line-height: 1.5; }
.game-instructions li::before { content: '▸'; position: absolute; left: 0; color: var(--accent); font-weight: bold; }

@media(max-width:640px){
  .nav-inner{height:52px;padding:0 16px}
  .main{padding:24px 16px 40px}
  #gameCanvas{max-width:100%;height:auto!important}
  .game-info{gap:12px;font-size:14px}
  .game-board-container{overflow-x:auto}
}
</style>
</head>
<body>
<nav class="nav"><div class="nav-inner"><div class="nav-left"><a href="/games/" class="logo">🎮 GAME</a><a href="/games/" class="nav-back">← 返回</a></div></div></nav>

<main class="main">


<div class="game-container">
  <div class="game-header">
    <h1>✈️ 飞机大战</h1>
    <div class="game-controls">
      <button id="startBtn" onclick="startGame()">开始游戏</button>
      <button id="pauseBtn" onclick="togglePause()" disabled>暂停</button>
    </div>
    <div class="game-info">
      <div class="score">得分: <span id="score">0</span></div>
      <div class="high-score">最高分: <span id="highScore">0</span></div>
      <div class="lives">生命: <span id="lives">3</span></div>
    </div>
  </div>
  
  <div class="game-board-container">
    <canvas id="gameCanvas" width="480" height="640"></canvas>
    <div id="gameOver" class="game-over hidden">
      <h2>游戏结束!</h2>
      <p>得分: <span id="finalScore">0</span></p>
      <button onclick="restartGame()">重新开始</button>
    </div>
  </div>
  
  <div class="game-instructions">
    <h3>游戏说明</h3>
    <ul>
      <li>使用方向键或WASD控制飞机移动</li>
      <li>空格键发射子弹</li>
      <li>击落敌机得分</li>
      <li>避免被敌机撞到</li>
    </ul>
  </div>
</div>

<style>
  .game-container {
    max-width: 600px;
    margin: 0 auto;
    padding: 20px;
    text-align: center;
  }
  
  .game-header h1 {
    font-size: 2.5em;
    margin-bottom: 20px;
  }
  
  .game-controls {
    margin: 20px 0;
  }
  
  .game-controls button {
    padding: 10px 20px;
    margin: 0 10px;
    font-size: 16px;
    cursor: pointer;
    background: #6c5ce7;
    color: white;
    border: none;
    border-radius: 5px;
    transition: all 0.3s;
  }
  
  .game-controls button:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
  }
  
  .game-controls button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  
  .game-info {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin: 20px 0;
    font-size: 18px;
  }
  
  .game-board-container {
    position: relative;
    display: inline-block;
    margin: 20px 0;
  }
  
  #gameCanvas {
    border: 3px solid #f0f0f5;
    background: linear-gradient(to bottom, #0f0c29, #302b63, #24243e);
    display: block;
  }
  
  .game-over {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.9);
    color: white;
    padding: 30px;
    border-radius: 10px;
    text-align: center;
  }
  
  .game-over.hidden {
    display: none;
  }
  
  .game-over button {
    margin-top: 15px;
    padding: 10px 20px;
    font-size: 16px;
    cursor: pointer;
    background: #6c5ce7;
    color: white;
    border: none;
    border-radius: 5px;
  }
  
  .game-instructions {
    margin-top: 30px;
    text-align: left;
    padding: 20px;
    background: #16162a;
    border-radius: 10px;
  }
  
  .game-instructions h3 {
    margin-bottom: 15px;
  }
  
  .game-instructions ul {
    list-style: none;
    padding: 0;
  }
  
  .game-instructions li {
    padding: 8px 0;
    padding-left: 20px;
    position: relative;
  }
  
  .game-instructions li:before {
    content: "•";
    position: absolute;
    left: 0;
    color: #6c5ce7;
  }
</style>

<script>
  const airplaneCanvas = document.getElementById('gameCanvas');
  const airplaneCtx = airplaneCanvas.getContext('2d');
  
  let player = {
    x: 240,
    y: 580,
    width: 40,
    height: 40,
    speed: 5
  };
  
  let bullets = [];
  let enemies = [];
  let score = 0;
  let highScore = localStorage.getItem('airplaneHighScore') || 0;
  let lives = 3;
  let gameLoop = null;
  let isPaused = false;
  let enemySpawnTimer = 0;

  document.getElementById('highScore').textContent = highScore;
  
  function drawPlayer() {
    airplaneCtx.fillStyle = '#00ff00';
    airplaneCtx.beginPath();
    airplaneCtx.moveTo(player.x, player.y - player.height / 2);
    airplaneCtx.lineTo(player.x - player.width / 2, player.y + player.height / 2);
    airplaneCtx.lineTo(player.x + player.width / 2, player.y + player.height / 2);
    airplaneCtx.closePath();
    airplaneCtx.fill();
    
    airplaneCtx.fillStyle = '#00cc00';
    airplaneCtx.fillRect(player.x - 5, player.y - 10, 10, 20);
  }
  
  function drawBullets() {
    airplaneCtx.fillStyle = '#ffff00';
    for (let bullet of bullets) {
      airplaneCtx.fillRect(bullet.x - 2, bullet.y - 8, 4, 16);
    }
  }
  
  function drawEnemies() {
    for (let enemy of enemies) {
      airplaneCtx.fillStyle = '#ff0000';
      airplaneCtx.beginPath();
      airplaneCtx.moveTo(enemy.x, enemy.y + enemy.height / 2);
      airplaneCtx.lineTo(enemy.x - enemy.width / 2, enemy.y - enemy.height / 2);
      airplaneCtx.lineTo(enemy.x + enemy.width / 2, enemy.y - enemy.height / 2);
      airplaneCtx.closePath();
      airplaneCtx.fill();
      
      airplaneCtx.fillStyle = '#cc0000';
      airplaneCtx.fillRect(enemy.x - 5, enemy.y - 10, 10, 20);
    }
  }
  
  function updateBullets() {
    for (let i = bullets.length - 1; i >= 0; i--) {
      bullets[i].y -= 10;
      if (bullets[i].y < 0) {
        bullets.splice(i, 1);
      }
    }
  }
  
  function updateEnemies() {
    for (let i = enemies.length - 1; i >= 0; i--) {
      enemies[i].y += enemies[i].speed;
      
      if (enemies[i].y > airplaneCanvas.height) {
        enemies.splice(i, 1);
        continue;
      }
      
      // 检测与玩家碰撞
      if (checkCollision(player, enemies[i])) {
        lives--;
        document.getElementById('lives').textContent = lives;
        enemies.splice(i, 1);
        
        if (lives === 0) {
          gameOver();
        }
        continue;
      }
      
      // 检测与子弹碰撞
      for (let j = bullets.length - 1; j >= 0; j--) {
        if (checkCollision(bullets[j], enemies[i])) {
          score += 10;
          document.getElementById('score').textContent = score;
          
          if (score > highScore) {
            highScore = score;
            document.getElementById('highScore').textContent = highScore;
            localStorage.setItem('airplaneHighScore', highScore);
          }
          
          bullets.splice(j, 1);
          enemies.splice(i, 1);
          break;
        }
      }
    }
  }
  
  function checkCollision(obj1, obj2) {
    const x1 = obj1.x - (obj1.width || 4) / 2;
    const y1 = obj1.y - (obj1.height || 16) / 2;
    const w1 = obj1.width || 4;
    const h1 = obj1.height || 16;
    
    const x2 = obj2.x - obj2.width / 2;
    const y2 = obj2.y - obj2.height / 2;
    
    return x1 < x2 + obj2.width &&
           x1 + w1 > x2 &&
           y1 < y2 + obj2.height &&
           y1 + h1 > y2;
  }
  
  function spawnEnemy() {
    enemySpawnTimer++;
    if (enemySpawnTimer >= 60) {
      enemySpawnTimer = 0;
      enemies.push({
        x: Math.random() * (airplaneCanvas.width - 40) + 20,
        y: -20,
        width: 40,
        height: 40,
        speed: 2 + Math.random() * 2
      });
    }
  }
  
  function draw() {
    airplaneCtx.clearRect(0, 0, airplaneCanvas.width, airplaneCanvas.height);
    
    drawPlayer();
    drawBullets();
    drawEnemies();
    
    updateBullets();
    updateEnemies();
    spawnEnemy();
  }
  
  function gameStep() {
    if (!isPaused) {
      draw();
    }
    gameLoop = requestAnimationFrame(gameStep);
  }
  
  function startGame() {
    score = 0;
    lives = 3;
    bullets = [];
    enemies = [];
    enemySpawnTimer = 0;
    isPaused = false;
    player.x = 240;
    player.y = 580;
    
    document.getElementById('score').textContent = score;
    document.getElementById('lives').textContent = lives;
    
    document.getElementById('startBtn').disabled = true;
    document.getElementById('pauseBtn').disabled = false;
    document.getElementById('pauseBtn').textContent = '暂停';
    document.getElementById('gameOver').classList.add('hidden');
    
    if (gameLoop) {
      cancelAnimationFrame(gameLoop);
    }
    
    gameLoop = requestAnimationFrame(gameStep);
  }
  
  function togglePause() {
    isPaused = !isPaused;
    document.getElementById('pauseBtn').textContent = isPaused ? '继续' : '暂停';
  }
  
  function gameOver() {
    cancelAnimationFrame(gameLoop);
    gameLoop = null;
    isPaused = false;
    document.getElementById('finalScore').textContent = score;
    document.getElementById('gameOver').classList.remove('hidden');
    document.getElementById('startBtn').disabled = false;
    document.getElementById('pauseBtn').disabled = true;
    document.getElementById('pauseBtn').textContent = '暂停';
  }
  
  function restartGame() {
    startGame();
  }
  
  // 键盘控制
  let keys = {};
  
  document.addEventListener('keydown', (e) => {
    keys[e.key] = true;
    
    if (e.key === ' ') {
      e.preventDefault();
      if (gameLoop && !isPaused) {
        bullets.push({
          x: player.x,
          y: player.y - player.height / 2
        });
      }
    }
  });
  
  document.addEventListener('keyup', (e) => {
    keys[e.key] = false;
  });
  
  // 移动更新
  setInterval(() => {
    if (!gameLoop || isPaused) return;
    
    if ((keys['ArrowLeft'] || keys['a'] || keys['A']) && player.x > player.width / 2) {
      player.x -= player.speed;
    }
    if ((keys['ArrowRight'] || keys['d'] || keys['D']) && player.x < airplaneCanvas.width - player.width / 2) {
      player.x += player.speed;
    }
    if ((keys['ArrowUp'] || keys['w'] || keys['W']) && player.y > player.height / 2) {
      player.y -= player.speed;
    }
    if ((keys['ArrowDown'] || keys['s'] || keys['S']) && player.y < airplaneCanvas.height - player.height / 2) {
      player.y += player.speed;
    }
  }, 16);
  
  // 初始绘制
  draw();
</script>

</main>
