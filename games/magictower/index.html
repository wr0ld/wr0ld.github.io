<style>
:root {
  color-scheme: dark;--bg:#0a0a0f;--card:#16162a;--t1:#f0f0f5;--t2:#8b8ba3;--accent:#6c5ce7;--border:rgba(255,255,255,.06)}
*{margin:0;padding:0;box-sizing:border-box}
  html{background:var(--bg)}
body{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t1);min-height:100vh}
.nav{position:sticky;top:0;z-index:100;backdrop-filter:blur(20px);background:rgba(10,10,15,.78);border-bottom:1px solid var(--border);padding:0 24px}
.nav-inner{max-width:900px;margin:0 auto;height:60px;display:flex;align-items:center;justify-content:space-between}
.nav-left{display:flex;align-items:center;gap:16px}
.logo{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;font-weight:700;font-size:1.15rem;text-decoration:none;color:#a29bfe}
.nav-back{color:var(--t2);text-decoration:none;font-size:.85rem;padding:6px 14px;border-radius:8px;border:1px solid var(--border);transition:.2s}
.nav-back:hover{color:var(--t1);background:rgba(255,255,255,.05)}

.main{max-width:800px;margin:0 auto;padding:36px 20px 60px;text-align:center}

/* 游戏容器样式覆盖 */
.game-container { max-width: 100%; margin: 0 auto; padding: 0; text-align: center; }
.game-header h1 { font-size: 2em; margin-bottom: 22px; font-weight: 700; }
.game-controls { margin: 18px 0; }
.game-controls button { padding: 10px 24px; margin: 0 8px; font-size: 15px; cursor: pointer; background: linear-gradient(135deg,#6c5ce7,#a29bfe); color: #fff; border: none; border-radius: 10px; font-weight: 600; transition: .25s; }
.game-controls button:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(108,92,231,.4); }
.game-controls button:disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
.game-controls select { padding: 10px 14px; font-size: 15px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--t1); outline: none; }

.game-info { display: flex; justify-content: center; gap: 20px; margin: 16px 0; font-size: 16px; color: var(--t2); flex-wrap: wrap; }
.game-info span { color: var(--accent); font-weight: 500; }
.game-board-container { position: relative; display: inline-block; margin: 18px 0; }

#gameCanvas, #nextCanvas { border: 2px solid rgba(108,92,231,.3); border-radius: 12px; display: block; }

.game-over, .game-win {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  background: rgba(10,10,15,.95); color: #fff; padding: 34px 44px;
  border-radius: 16px; text-align: center; border: 1px solid var(--border);
  backdrop-filter: blur(12px); z-index: 10;
}
.game-over.hidden, .game-win.hidden { display: none !important; }
.game-over h2, .game-win h2 { font-size: 1.6em; margin-bottom: 14px; color: #e74c3c; }
.game-over p, .game-win p { margin-bottom: 18px; color: var(--t2); font-size: 1.05em; }
.game-over button, .game-win button {
  padding: 11px 28px; font-size: 15px; cursor: pointer;
  background: linear-gradient(135deg,#6c5ce7,#a29bfe); color: #fff;
  border: none; border-radius: 10px; font-weight: 600;
}

.game-instructions {
  margin-top: 32px; text-align: left; padding: 22px 26px;
  background: var(--card); border-radius: 14px; border: 1px solid var(--border);
}
.game-instructions h3 { margin-bottom: 14px; color: var(--accent); font-size: 1.05em; }
.game-instructions ul { list-style: none; padding: 0; }
.game-instructions li { padding: 7px 0 7px 22px; position: relative; color: var(--t2); font-size: .9rem; line-height: 1.5; }
.game-instructions li::before { content: '▸'; position: absolute; left: 0; color: var(--accent); font-weight: bold; }

@media(max-width:640px){
  .nav-inner{height:52px;padding:0 16px}
  .main{padding:24px 16px 40px}
  #gameCanvas{max-width:100%;height:auto!important}
  .game-info{gap:12px;font-size:14px}
  .game-board-container{overflow-x:auto}
}
</style>
</head>

    isTop: true

];

const SHOP_ITEMS = [
  { name: '生命+1000', cost: 100, effect: { hp: 1000 } },
  { name: '攻击+10', cost: 150, effect: { atk: 10 } },
  { name: '防御+10', cost: 150, effect: { def: 10 } },
  { name: '黄钥匙x3', cost: 50, effect: { yellowKey: 3 } },
  { name: '蓝钥匙x2', cost: 100, effect: { blueKey: 2 } },
  { name: '红钥匙x1', cost: 200, effect: { redKey: 1 } }
];

class MagicTower {
  constructor() {
    this.canvas = document.getElementById('towerCanvas');
    this.ctx = this.canvas.getContext('2d');
    this.loadGame();
    this.init();
  }

  init() {
    document.addEventListener('keydown', (e) => this.handleKey(e));
    this.render();
    this.updateUI();
  }

  reset() {
    this.player = {
      x: 2, y: 2,
      hp: 1000,
      atk: 10,
      def: 10,
      gold: 0,
      keys: { yellow: 1, blue: 0, red: 0 }
    };
    this.currentFloor = 0;
    this.floors = JSON.parse(JSON.stringify(FLOORS));
    this.gameOver = false;
  }

  handleKey(e) {
    if (this.gameOver) return;

    const keyMap = {
      'ArrowUp': [0, -1], 'w': [0, -1], 'W': [0, -1],
      'ArrowDown': [0, 1], 's': [0, 1], 'S': [0, 1],
      'ArrowLeft': [-1, 0], 'a': [-1, 0], 'A': [-1, 0],
      'ArrowRight': [1, 0], 'd': [1, 0], 'D': [1, 0]
    };

    if (keyMap[e.key]) {
      e.preventDefault();
      this.move(...keyMap[e.key]);
    }
  }

  move(dx, dy) {
    const newX = this.player.x + dx;
    const newY = this.player.y + dy;
    const floor = this.floors[this.currentFloor];

    if (newX < 0 || newX >= MAP_WIDTH || newY < 0 || newY >= MAP_HEIGHT) return;

    const tile = floor.map[newY][newX];

    if (this.handleTile(tile, newX, newY)) {
      floor.map[this.player.y][this.player.x] = 0;
      this.player.x = newX;
      this.player.y = newY;
      floor.map[newY][newX] = 2;
      this.render();
      this.updateUI();
    }
  }

  handleTile(tile, x, y) {
    if (tile === 1) return false;

    if (tile === 5) {
      if (this.player.keys.yellow > 0) {
        this.player.keys.yellow--;
        this.log('使用黄钥匙开门');
        return true;
      }
      this.log('需要黄钥匙！');
      return false;
    }

    if (tile === 6) {
      if (this.player.keys.blue > 0) {
        this.player.keys.blue--;
        this.log('使用蓝钥匙开门');
        return true;
      }
      this.log('需要蓝钥匙！');
      return false;
    }

    if (tile === 7) {
      if (this.player.keys.red > 0) {
        this.player.keys.red--;
        this.log('使用红钥匙开门');
        return true;
      }
      this.log('需要红钥匙！');
      return false;
    }

    if (typeof tile === 'string' && MONSTERS[tile]) {
      return this.fight(tile, x, y);
    }

    if (tile === 3) {
      this.goUp();
      return false;
    }

    if (tile === 4) {
      this.goDown();
      return false;
    }

    if (tile === 8) {
      this.player.keys.yellow++;
      this.log('获得黄钥匙');
      return true;
    }

    if (tile === 9) {
      this.player.keys.blue++;
      this.log('获得蓝钥匙');
      return true;
    }

    if (tile === 10) {
      this.player.keys.red++;
      this.log('获得红钥匙');
      return true;
    }

    if (tile === 11) {
      this.player.hp += 200;
      this.log('使用红药水，生命+200');
      return true;
    }

    if (tile === 12) {
      this.player.hp += 500;
      this.log('使用蓝药水，生命+500');
      return true;
    }

    if (tile === 13) {
      this.player.atk += 3;
      this.log('使用红宝石，攻击+3');
      return true;
    }

    if (tile === 14) {
      this.player.def += 3;
      this.log('使用蓝宝石，防御+3');
      return true;
    }

    if (tile === 15) {
      this.player.gold += 50;
      this.log('获得50金币');
      return true;
    }

    if (tile === 16) {
      this.openShop();
      return false;
    }

    return true;
  }

  fight(monsterType, x, y) {
    const monster = MONSTERS[monsterType];
    const damage = this.calculateDamage(monster);

    if (damage === Infinity) {
      this.log(`无法击败${monster.name}！防御太低！`);
      return false;
    }

    if (damage >= this.player.hp) {
      this.log(`无法击败${monster.name}！生命不足！`);
      return false;
    }

    this.player.hp -= damage;
    this.player.gold += monster.gold;
    this.log(`击败${monster.name}，损失${damage}生命，获得${monster.gold}金币`);

    if (monster.isBoss) {
      this.log(`🎉 击败了Boss：${monster.name}！`);
    }

    return true;
  }

  calculateDamage(monster) {
    if (this.player.atk <= monster.def) return Infinity;

    const playerDamage = this.player.atk - monster.def;
    const monsterDamage = Math.max(0, monster.atk - this.player.def);

    const rounds = Math.ceil(monster.hp / playerDamage);
    return monsterDamage * (rounds - 1);
  }

  goUp() {
    if (this.currentFloor >= this.floors.length - 1) {
      if (this.floors[this.currentFloor].isTop) {
        this.victory();
      }
      return;
    }

    this.currentFloor++;
    const floor = this.floors[this.currentFloor];
    this.player.x = floor.start.x;
    this.player.y = floor.start.y;
    floor.map[this.player.y][this.player.x] = 2;
    this.log(`上到第${this.currentFloor + 1}层`);
    this.render();
    this.updateUI();
  }

  goDown() {
    if (this.currentFloor <= 0) return;

    const currentFloor = this.floors[this.currentFloor];
    currentFloor.map[this.player.y][this.player.x] = 4;

    this.currentFloor--;
    const floor = this.floors[this.currentFloor];
    this.player.x = floor.start.x;
    this.player.y = floor.start.y;

    for (let y = 0; y < MAP_HEIGHT; y++) {
      for (let x = 0; x < MAP_WIDTH; x++) {
        if (floor.map[y][x] === 2) floor.map[y][x] = 0;
      }
    }
    floor.map[this.player.y][this.player.x] = 2;

    this.log(`下到第${this.currentFloor + 1}层`);
    this.render();
    this.updateUI();
  }

  openShop() {
    const modal = document.getElementById('shopModal');
    const itemsDiv = document.getElementById('shopItems');

    itemsDiv.innerHTML = SHOP_ITEMS.map((item, index) => `
      <div class="shop-item ${this.player.gold < item.cost ? 'disabled' : ''}" 
           onclick="game.buyItem(${index})">
        <span>${item.name}</span>
        <span>💰 ${item.cost}</span>
      </div>
    `).join('');

    modal.classList.remove('hidden');
  }

  closeShop() {
    document.getElementById('shopModal').classList.add('hidden');
  }

  buyItem(index) {
    const item = SHOP_ITEMS[index];
    if (this.player.gold < item.cost) return;

    this.player.gold -= item.cost;

    if (item.effect.hp) this.player.hp += item.effect.hp;
    if (item.effect.atk) this.player.atk += item.effect.atk;
    if (item.effect.def) this.player.def += item.effect.def;
    if (item.effect.yellowKey) this.player.keys.yellow += item.effect.yellowKey;
    if (item.effect.blueKey) this.player.keys.blue += item.effect.blueKey;
    if (item.effect.redKey) this.player.keys.red += item.effect.redKey;

    this.log(`购买${item.name}`);
    this.updateUI();
    this.openShop();
  }

  victory() {
    document.getElementById('finalAtk').textContent = this.player.atk;
    document.getElementById('finalDef').textContent = this.player.def;
    document.getElementById('victoryModal').classList.remove('hidden');
    this.gameOver = true;
  }

  showGameOver(reason) {
    document.getElementById('gameOverReason').textContent = reason;
    document.getElementById('finalFloor').textContent = this.currentFloor + 1;
    document.getElementById('gameOverModal').classList.remove('hidden');
    this.gameOver = true;
  }

  render() {
    const ctx = this.ctx;
    const floor = this.floors[this.currentFloor];

    ctx.fillStyle = '#111';
    ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

    for (let y = 0; y < MAP_HEIGHT; y++) {
      for (let x = 0; x < MAP_WIDTH; x++) {
        const tile = floor.map[y][x];
        this.drawTile(ctx, x, y, tile);
      }
    }
  }

  drawTile(ctx, x, y, tile) {
    const px = x * TILE_SIZE;
    const py = y * TILE_SIZE;

    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);

    if (tile === 1) {
      ctx.fillStyle = '#4a4a6a';
      ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
      ctx.strokeStyle = '#3a3a5a';
      ctx.strokeRect(px, py, TILE_SIZE, TILE_SIZE);
    }

    if (tile === 2) {
      ctx.fillStyle = '#3498db';
      ctx.beginPath();
      ctx.arc(px + TILE_SIZE/2, py + TILE_SIZE/2, TILE_SIZE/3, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = '16px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('勇', px + TILE_SIZE/2, py + TILE_SIZE/2 + 5);
    }

    if (tile === 3) {
      ctx.fillStyle = '#2ecc71';
      ctx.beginPath();
      ctx.moveTo(px + TILE_SIZE/2, py + 4);
      ctx.lineTo(px + TILE_SIZE - 4, py + TILE_SIZE - 4);
      ctx.lineTo(px + 4, py + TILE_SIZE - 4);
      ctx.closePath();
      ctx.fill();
    }

    if (tile === 4) {
      ctx.fillStyle = '#e74c3c';
      ctx.beginPath();
      ctx.moveTo(px + TILE_SIZE/2, py + TILE_SIZE - 4);
      ctx.lineTo(px + TILE_SIZE - 4, py + 4);
      ctx.lineTo(px + 4, py + 4);
      ctx.closePath();
      ctx.fill();
    }

    if (tile === 5 || tile === 6 || tile === 7) {
      const colors = { 5: '#f1c40f', 6: '#3498db', 7: '#e74c3c' };
      ctx.fillStyle = colors[tile];
      ctx.fillRect(px + 4, py + 4, TILE_SIZE - 8, TILE_SIZE - 8);
      ctx.fillStyle = '#000';
      ctx.fillRect(px + TILE_SIZE/2 - 3, py + 10, 6, 12);
    }

    if (tile === 8 || tile === 9 || tile === 10) {
      const colors = { 8: '#f1c40f', 9: '#3498db', 10: '#e74c3c' };
      ctx.fillStyle = colors[tile];
      ctx.beginPath();
      ctx.arc(px + TILE_SIZE/2, py + TILE_SIZE/2, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.fillRect(px + TILE_SIZE/2 - 2, py + TILE_SIZE/2 - 2, 4, 8);
    }

    if (tile === 11) {
      ctx.fillStyle = '#e74c3c';
      ctx.beginPath();
      ctx.arc(px + TILE_SIZE/2, py + TILE_SIZE/2, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = '12px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('+', px + TILE_SIZE/2, py + TILE_SIZE/2 + 4);
    }

    if (tile === 12) {
      ctx.fillStyle = '#3498db';
      ctx.beginPath();
      ctx.arc(px + TILE_SIZE/2, py + TILE_SIZE/2, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = '12px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('+', px + TILE_SIZE/2, py + TILE_SIZE/2 + 4);
    }

    if (tile === 13) {
      ctx.fillStyle = '#e74c3c';
      this.drawGem(ctx, px, py);
    }

    if (tile === 14) {
      ctx.fillStyle = '#3498db';
      this.drawGem(ctx, px, py);
    }

    if (tile === 15) {
      ctx.fillStyle = '#f1c40f';
      ctx.beginPath();
      ctx.arc(px + TILE_SIZE/2, py + TILE_SIZE/2, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#c0392b';
      ctx.font = 'bold 14px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('$', px + TILE_SIZE/2, py + TILE_SIZE/2 + 5);
    }

    if (tile === 16) {
      ctx.fillStyle = '#9b59b6';
      ctx.fillRect(px + 4, py + 8, TILE_SIZE - 8, TILE_SIZE - 16);
      ctx.fillStyle = '#f1c40f';
      ctx.font = '16px Arial';
      ctx.textAlign = 'center';
      ctx.fillText('店', px + TILE_SIZE/2, py + TILE_SIZE/2 + 5);
    }

    if (typeof tile === 'string' && MONSTERS[tile]) {
      const monster = MONSTERS[tile];
      ctx.fillStyle = monster.color;
      ctx.beginPath();
      ctx.arc(px + TILE_SIZE/2, py + TILE_SIZE/2, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#fff';
      ctx.font = monster.isBoss ? 'bold 14px Arial' : '12px Arial';
      ctx.textAlign = 'center';
      ctx.fillText(monster.name[0], px + TILE_SIZE/2, py + TILE_SIZE/2 + 4);
    }
  }

  drawGem(ctx, px, py) {
    ctx.beginPath();
    ctx.moveTo(px + TILE_SIZE/2, py + 6);
    ctx.lineTo(px + TILE_SIZE - 6, py + TILE_SIZE/2);
    ctx.lineTo(px + TILE_SIZE/2, py + TILE_SIZE - 6);
    ctx.lineTo(px + 6, py + TILE_SIZE/2);
    ctx.closePath();
    ctx.fill();
  }

  updateUI() {
    document.getElementById('hp').textContent = this.player.hp;
    document.getElementById('atk').textContent = this.player.atk;
    document.getElementById('def').textContent = this.player.def;
    document.getElementById('gold').textContent = this.player.gold;
    document.getElementById('yellowKey').textContent = this.player.keys.yellow;
    document.getElementById('blueKey').textContent = this.player.keys.blue;
    document.getElementById('redKey').textContent = this.player.keys.red;
    document.getElementById('currentFloor').textContent = this.currentFloor + 1;
  }

  log(msg) {
    const logDiv = document.getElementById('gameLog');
    const p = document.createElement('p');
    p.textContent = msg;
    logDiv.insertBefore(p, logDiv.firstChild);
    if (logDiv.children.length > 20) logDiv.removeChild(logDiv.lastChild);
  }

  saveGame() {
    const saveData = {
      player: this.player,
      currentFloor: this.currentFloor,
      floors: this.floors
    };
    localStorage.setItem('magictower_save', JSON.stringify(saveData));
    this.log('游戏已保存');
  }

  loadGame() {
    const saved = localStorage.getItem('magictower_save');
    if (saved) {
      const data = JSON.parse(saved);
      this.player = data.player;
      this.currentFloor = data.currentFloor;
      this.floors = data.floors;
      this.gameOver = false;
      this.log('读取存档成功');
    } else {
      this.reset();
    }
  }

  restart() {
    localStorage.removeItem('magictower_save');
    this.reset();
    document.getElementById('gameOverModal').classList.add('hidden');
    document.getElementById('victoryModal').classList.add('hidden');
    this.render();
    this.updateUI();
    this.log('重新开始游戏');
  }
}

const game = new MagicTower();
