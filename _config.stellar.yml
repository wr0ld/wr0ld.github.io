######## Sidebar ########
logo:
  avatar: '[{config.avatar}](/about/)'
  title: '[{config.title}](/)'
  subtitle: '{config.subtitle}'

menubar:
  columns: 3
  items:
    # 主题页面
    - id: post
      theme: '#1BCDFC'
      icon: solar:documents-bold-duotone
      title: 博客
      url: /
    - id: about
      theme: '#3DC550'
      icon: solar:user-bold-duotone
      title: 关于
      url: /about/
    - id: settings
      theme: '#9B59B6'
      icon: solar:settings-bold-duotone
      title: 设置
      url: /settings/
    # 分隔线
    - divider: true
    # 外部页面
    - id: lab
      theme: '#F39C12'
      icon: solar:programming-bold-duotone
      title: 实验室
      url: /lab/
    - id: gallery
      theme: '#FF9FF3'
      icon: solar:gallery-bold-duotone
      title: 相册
      url: /gallery/
    - id: games
      theme: '#FF6B6B'
      icon: solar:gamepad-bold-duotone
      title: 游戏
      url: /games/
    - id: cards
      theme: '#E91E63'
      icon: solar:card-bold-duotone
      title: 卡牌
      url: "javascript:if(window.CardSystem)window.CardSystem.showPanel()"

######## Main ########
site_tree:
  home:
    leftbar: welcome, todo
    rightbar: categories
  index_blog:
    leftbar: welcome, todo
    rightbar: categories
  post:
    leftbar: todo
    rightbar: toc
  archives:
    leftbar: welcome, todo
    rightbar: categories
  category:
    leftbar: welcome, todo
    rightbar: categories
  tag:
    leftbar: welcome, todo
    rightbar: categories
  page:
    leftbar: 
    rightbar: toc

######## Article ########
article:
  type: tech
  auto_cover: true
  auto_banner: true
  auto_excerpt: 200
  license: '本文采用 [CC BY-NC-SA 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/) 许可协议，转载请注明出处。'

######## Style ########
style:
  prefers_theme: dark # auto / light / dark
  smooth_scroll: false
  leftbar:
    background-image: url(https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.13/image/sidebar-bg1@small.jpg)
    blur-px: 100px
    blur-bg: var(--bg-a60)
    background-opacity: 0.8

######## Comments ########
comments:
  service: 
  comment_title: 评论

######## Footer ########
footer:
  sitemap:
    '博客':
      - '[首页](/)'
      - '[归档](/archives/)'
    '关于':
      - '[关于我](/about/)'
  content: |

######## Category Order ########
category_order:
  - 其他
  - 实战
  - 代码审计
  - 安全工具
  - Windows
  - linux
  - web
  - 笔记

######## Subcategory Order ########
subcategory_order:
  代码审计:
    - 内存马
    - log4j
    - shiro
    - cc
    - fastjson
  安全工具:
    - 工具魔改
    - 工具
  linux:
    - 靶机渗透
    - vulnhub-DC

######## Plugins ########
plugins:
  fancybox:
    enable: false
    loader: /js/plugins/fancybox-loader.js
    js: https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.umd.js
    css: https://cdn.jsdelivr.net/npm/@fancyapps/ui@5.0/dist/fancybox/fancybox.css
    selector: .md-text img:not([class]), .md-text .image img
